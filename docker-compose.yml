services:
  osmanx:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OSMANX_DEMO_MODE: "${OSMANX_DEMO_MODE:-0}"
      OSMANX_ADMIN_PASSWORD: "${OSMANX_ADMIN_PASSWORD:-}"
      OSMANX_SESSION_SECRET: "${OSMANX_SESSION_SECRET:-}"
      OSMANX_BOOTSTRAP_EMAIL: "${OSMANX_BOOTSTRAP_EMAIL:-owner@osmanx.local}"
      OSMANX_DEVICE_MASTER_SECRET: "${OSMANX_DEVICE_MASTER_SECRET:-}"
    volumes:
      - osmanx_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    restart: unless-stopped
volumes:
  osmanx_data:
