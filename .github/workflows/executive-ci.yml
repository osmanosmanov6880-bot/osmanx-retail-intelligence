name: OSMANX Executive ATELIER R9 - payment reconciliation, bank close, exceptions, CFO
on:
  push:
    paths:
      - 'executive/**'
      - '.github/workflows/executive-ci.yml'
  pull_request:
    paths:
      - 'executive/**'
      - '.github/workflows/executive-ci.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: executive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test all legacy and R9 decision workflows
        run: npm test
      - name: Rebuild offline executive edition
        run: python3 scripts/build_standalone.py
      - name: Check syntax and deterministic bundled output
        run: |
          node --check src/app.mjs
          node --check src/r3_core.mjs
          node --check src/r4_core.mjs
          node --check src/r4_views.mjs
          node --check src/r4_dossier.mjs
          node --check src/r5_core.mjs
          node --check src/r5_views.mjs
          node --check src/r5_report.mjs
          node --check src/r6_core.mjs
          node --check src/r6_views.mjs
          node --check src/r7_core.mjs
          node --check src/r7_views.mjs
          node --check src/r7_pdf.mjs
          node --check src/r8_core.mjs
          node --check src/r8_views.mjs
          node --check src/r8_pdf.mjs
          node --check src/r9_core.mjs
          node --check src/r9_views.mjs
          node --check src/r9_pdf.mjs
          node --check build_check.js
          git diff --exit-code -- OSMANX_EXECUTIVE_OFFLINE.html
      - name: Verify required offline assets
        run: |
          test -s OSMANX_EXECUTIVE_OFFLINE.html
          test -s src/luxury.css
          test -s src/r3.css
          test -s src/r4.css
          test -s src/r5.css
          test -s src/r6.css
          test -s src/r7.css
          test -s src/r8.css
          test -s src/r9.css
          test -s assets/atelier-scene.webp
          test -s fixtures/r9_operations.csv
          test -s fixtures/r9_settlements.csv
  browser:
    runs-on: ubuntu-latest
    needs: unit
    defaults:
      run:
        working-directory: executive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: R1/R3/R4/R5/R6/R7/R8/R9 navigation, finance and responsive checks
        run: |
          python scripts/browser_smoke.py
          python scripts/r3_browser_smoke.py
          python scripts/r4_browser_smoke.py
          python scripts/r5_browser_smoke.py
          python scripts/r6_browser_smoke.py
          python scripts/r7_browser_smoke.py
          python scripts/r8_browser_smoke.py
          python scripts/r9_browser_smoke.py
      - name: Retain screenshots, CSV and A4 PDF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osmanx-r9-atelier-browser-qa
          path: executive/screenshots/
          retention-days: 14
