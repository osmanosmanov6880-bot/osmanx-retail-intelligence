name: OSMANX Executive ATELIER R3 - evidence, decisions, browser
on:
  push:
    paths:
      - 'executive/**'
      - '.github/workflows/executive-ci.yml'
  pull_request:
    paths:
      - 'executive/**'
      - '.github/workflows/executive-ci.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: executive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finance, reconciliation and user route tests
        run: npm test
      - name: Rebuild standalone release
        run: python3 scripts/build_standalone.py
      - name: Syntax and deterministic bundle verification
        run: |
          node --check src/app.mjs
          node --check src/r3_core.mjs
          node --check src/r3_views.mjs
          node --check build_check.js
          git diff --exit-code -- OSMANX_EXECUTIVE_OFFLINE.html
      - name: Verify embedded offline assets
        run: |
          test -s OSMANX_EXECUTIVE_OFFLINE.html
          test -s src/luxury.css
          test -s src/r3.css
          test -s assets/atelier-scene.webp
  browser:
    runs-on: ubuntu-latest
    needs: unit
    defaults:
      run:
        working-directory: executive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Executive interaction and visual viewport checks
        run: |
          python scripts/browser_smoke.py
          python scripts/r3_browser_smoke.py
      - name: Retain audited screenshots and generated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osmanx-r3-atelier-browser-qa
          path: executive/screenshots/
          retention-days: 14
