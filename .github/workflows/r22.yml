name: R22 Multi-Store Rollout QA
on:
  pull_request:
    paths:
      - "backend/r22.py"
      - "frontend/rollout*"
      - "frontend/r22_nav.js"
      - "tests/test_r22.py"
      - "scripts/r22_browser_smoke.py"
      - ".github/workflows/r22.yml"
  workflow_dispatch:
jobs:
  r22-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx playwright
          python -m playwright install --with-deps chromium
      - name: Python and JavaScript syntax
        run: |
          python -m compileall -q backend scripts
          node --check frontend/rollout.js
          node --check frontend/r22_nav.js
      - name: Isolated R2.0 and R2.2 API tests
        run: python -m pytest tests/test_r22.py -q
      - name: Chromium interactive browser scenarios
        run: python scripts/r22_browser_smoke.py
