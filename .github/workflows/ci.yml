name: Verify Retail Intelligence
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install backend and test dependencies
        run: pip install -r requirements.txt pytest httpx playwright
      - name: Core API and database tests
        run: python -m pytest tests/test_analytics.py tests/test_api.py tests/test_r03.py tests/test_r04.py tests/test_r05.py tests/test_r06.py tests/test_r06_main_compat.py -q
      - name: R0.7 and R0.8 regression tests
        run: python -m pytest tests/test_r07.py tests/test_r08.py -q
      - name: R0.9 integration, isolation and accounting tests
        run: python -m pytest tests/test_r09.py -q
      - name: R1.0 API and tenant isolation tests
        run: python -m pytest tests/test_r10.py -q
      - name: R1.1 loyalty, campaigns, retention and assortment API tests
        run: python -m pytest tests/test_r11.py -q
      - name: Check Python syntax
        run: python -m compileall -q backend scripts
      - name: Check frontend JS syntax
        run: |
          node --check frontend/app.js
          node --check frontend/commerce_ui.js
          node --check frontend/charts.js
          node --check frontend/icons.js
          node --check frontend/api.js
          node --check frontend/workflows.js
          node --check frontend/r06_shortcut.js
          node --check frontend/operations.js
          node --check frontend/assist.js
          node --check frontend/strategy.js
          node --check frontend/evidence.js
          node --check frontend/experience.js
          node --check frontend/growth.js
          node --check frontend/pulse.js
      - name: Install Chromium for browser checks
        run: python -m playwright install --with-deps chromium
      - name: Interactive browser acceptance (dashboard, kiosk, inventory)
        run: python scripts/visual_smoke.py
      - name: R0.3 browser acceptance (imports, devices, team, mobile)
        run: python scripts/r03_browser_smoke.py
      - name: R0.4 browser acceptance (paired kiosk, POS, quality, mobile)
        run: python scripts/r04_browser_smoke.py
      - name: R0.5 browser acceptance (reservations, fitting, returns, discounts, decisions)
        run: python scripts/r05_browser_smoke.py
      - name: R0.6 browser acceptance (demand, purchasing, revenue, experiments)
        run: python scripts/r06_browser_smoke.py
      - name: R0.7 store-operations browser acceptance
        run: python scripts/r07_browser_smoke.py
      - name: R0.8 decision-center browser acceptance
        run: python scripts/r08_browser_smoke.py
      - name: R0.9 evidence lab browser acceptance
        run: python scripts/r09_browser_smoke.py
      - name: R1.0 experience browser acceptance
        run: python scripts/r10_browser_smoke.py
      - name: R1.1 Growth Intelligence browser acceptance
        run: python scripts/r11_browser_smoke.py
      - name: Upload acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osmanx-retail-r11-ui
          path: |
            qa/r02-*.png
            qa/r03-*.png
            qa/r04-*.png
            qa/r05-*.png
            qa/r06-*.png
            qa/r07-*.png
            qa/r08-*.png
            qa/r09-*.png
            qa/r10-*.png
            qa/r11-*.png
          if-no-files-found: ignore
          retention-days: 7
