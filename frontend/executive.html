/* OSMANX EXECUTIVE R2 — ATELIER. Presentation-first, deliberately quiet. */
:root{
 color-scheme:dark;
 --bg:#080a0e;--bg2:#0b0d12;--panel:#101318;--panel2:#13171d;
 --ink:#f2f0eb;--muted:#a29f9b;--dim:#716f70;
 --stroke:#292c32;--stroke2:#24272d;--gold:#cbb18b;--gold-bright:#f1d6a8;
 --mint:#d8c09b;--mint2:#c6ae8a;--red:#c47b80;
 --sidebar:0px;--radius:12px;
 font-family:Inter,"Segoe UI",Arial,sans-serif;
}
body{background:#080a0e;color:var(--ink);letter-spacing:-.003em;overflow-x:hidden}
#app{min-width:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px}
em,.page-heading h1 em{color:var(--gold)!important}
.workspace{margin-left:0;max-width:100%;background:radial-gradient(ellipse 48% 32% at 91% 1%,rgba(79,64,47,.16),transparent 85%),#080a0e}
.main-content{width:100%;max-width:1770px;padding:38px clamp(20px,3.5vw,68px) 62px;margin:0 auto}
/* A proper navigation drawer rather than a permanent 250px sidebar. */
.sidebar{width:300px;max-width:min(90vw,345px);background:linear-gradient(155deg,#121317,#090b0f);border-right:1px solid #3a332c;transform:translateX(-105%);transition:transform .25s ease;visibility:hidden;box-shadow:32px 0 80px #0008;z-index:55}
.sidebar.is-open{transform:translateX(0);visibility:visible}
.sidebar .brand{padding:16px 0;gap:13px}
.sidebar .brand-mark span:first-child{background:linear-gradient(150deg,#e6d5bf,#9f7f58)}
.sidebar .brand-mark span:last-child{background:linear-gradient(150deg,#e9d9c3,#8b7155)}
.brand-name{font-family:Georgia,serif;letter-spacing:.12em;font-size:23px;font-weight:500}
.brand-name span{color:inherit}
.brand-sub{font-size:8px;letter-spacing:.21em;color:#b7a28a}
.drawer-top{display:flex;justify-content:space-between;align-items:center;padding:18px 21px 11px;border-bottom:1px solid #2a2828}
.drawer-close{display:grid;place-items:center;height:36px;width:36px;background:none;border:1px solid #36363a;border-radius:50%;color:#c9c7c0}
.drawer-close:hover{color:#f3dfc3;border-color:#8c7357}
.drawer-intro{padding:23px 23px 5px;font-size:10px;letter-spacing:.21em;color:#8d8174}
.sidebar-nav{padding:4px 13px 24px}
.nav-group-title{font-size:9px;color:#887969;font-weight:600;letter-spacing:.17em}
.nav-link{font-size:12px;min-height:42px;padding:11px 12px;border-radius:6px;color:#bbb9b5}
.nav-link:hover{background:#24211d;color:#fff}
.nav-link.active{background:linear-gradient(90deg,rgba(165,125,76,.16),rgba(165,125,76,.03));border-color:#584532;color:#f1dbc1}
.nav-link.active>svg{color:var(--gold)}.nav-link.active>i{background:var(--gold)}
.sidebar-bottom{border-top:1px solid #333037}.sidebar-bottom p{font-size:9px;color:#857b6f}
.demo-mini-dot{background:var(--gold);box-shadow:none}.demo-source{color:#a59a8e}
.mobile-backdrop{display:block;position:fixed;inset:0;background:#030406cf;backdrop-filter:blur(7px);z-index:50;border:0}
/* Understated boardroom masthead */
.topbar{min-height:78px;padding:0 clamp(20px,3.5vw,68px);border-bottom:1px solid #2b2a2a;background:#0a0b0edb;backdrop-filter:blur(22px);box-shadow:none;gap:16px}
.topbar-left{gap:17px;min-width:0}.topbar-right{gap:15px;min-width:0}
.mobile-menu.nav-trigger{display:grid;place-items:center;width:37px;height:37px;border:1px solid #343238;border-radius:50%;background:transparent;color:#d5d2cc;flex-shrink:0}
.mobile-menu.nav-trigger:hover{background:#25211c;color:#f0ddbe;border-color:#8e7859}
.header-brand{display:flex;align-items:center;gap:12px;color:#f5f0e8;background:none;border:none;padding:0;text-align:left;white-space:nowrap}
.header-x{font-family:Georgia,serif;font-size:31px;transform:skewX(-13deg);color:var(--gold-bright);font-weight:bold;line-height:1.1}
.header-brand-text{display:flex;flex-direction:column;gap:4px}
.header-brand-text b{font-family:Georgia,serif;letter-spacing:.18em;font-size:19px;font-weight:500}
.header-brand-text small{font-size:8px;letter-spacing:.25em;color:#ada397}
.header-rule{width:1px;height:27px;background:#37312a;margin:0 8px 0 12px;flex-shrink:0}
.header-nav{display:flex;align-items:center;gap:clamp(7px,1.7vw,28px)}
.header-nav button{background:none;border:0;color:#aba9a6;font-size:11px;text-transform:uppercase;letter-spacing:.14em;padding:16px 6px;white-space:nowrap}
.header-nav button:hover,.header-nav button.on{color:var(--gold-bright)}
.header-nav button.on:after{content:"";display:block;height:1px;background:#ab855f;margin-top:8px}
.topbar .global-demo{display:flex!important;align-items:center;gap:8px;color:#b1a796;font-size:9px;letter-spacing:.07em;white-space:nowrap}
.global-demo i{width:5px;height:5px;background:var(--gold)}
.topbar .scenario-select{font-size:10px;color:#d1c5b5;min-width:132px;max-width:228px;padding:9px 9px;background:#15161a;border:1px solid #34302e;border-radius:6px}
.top-demo-btn{background:linear-gradient(130deg,#d8bd98,#b69b74);border:1px solid #ead2ac;color:#141311;font-size:10.5px;letter-spacing:.015em;font-weight:700;border-radius:6px;padding:12px 14px;gap:8px}
.top-demo-btn:hover,.btn-primary:hover{background:#f3dab4;color:#1b1711}
/* Hero is a real piece of interface: not a rasterized mockup of the app. */
.luxury-hero{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,.96fr);gap:clamp(20px,3.3vw,53px);align-items:stretch;min-height:540px;margin:0 0 26px;position:relative}
.luxury-copy{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-width:0;padding:31px 0 20px}
.luxury-kicker{display:flex;align-items:center;gap:13px;letter-spacing:.24em;font-size:10px;color:#c8b7a0;font-weight:600;margin:0 0 38px;white-space:nowrap}
.luxury-kicker>span:last-child{margin-left:8px;color:#67635f;letter-spacing:.12em}
.kicker-line{height:1px;width:30px;background:var(--gold)}
.luxury-page-name{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#918a80;margin-bottom:16px}
.luxury-copy h1{font-family:"Iowan Old Style","Baskerville","Times New Roman",Georgia,serif;letter-spacing:-.055em;font-weight:400;font-size:clamp(42px,4.5vw,76px);line-height:1.07;margin:0;max-width:850px;text-wrap:balance}
.luxury-copy h1 em{color:#d9b888!important;font-style:normal}
.luxury-lead{max-width:545px;color:#a29f9b;font-size:clamp(12px,1.03vw,15px);line-height:1.9;letter-spacing:.005em;margin:25px 0 30px}
.luxury-actions{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.luxury-primary{display:inline-flex;align-items:center;justify-content:center;gap:16px;background:linear-gradient(115deg,#e6cfaa,#c6a477);border:1px solid #e1c499;border-radius:5px;color:#181510;padding:14px 18px;font-size:12px;font-weight:720;white-space:nowrap;min-height:51px;box-shadow:0 8px 30px #88653822}
.luxury-primary:hover{background:linear-gradient(115deg,#fff0cf,#d6b68b);color:#15110d;transform:translateY(-1px)}
.button-play{height:21px;width:21px;display:grid;place-items:center;border:1px solid #35291e;border-radius:50%}
.luxury-secondary{display:inline-flex;align-items:center;gap:12px;background:transparent;border:1px solid #4b4238;border-radius:5px;color:#ead8bc;padding:15px 17px;min-height:51px;font-size:12px}
.luxury-secondary:hover{border-color:#af9677;background:#1d1915}
.luxury-proofline{display:flex;gap:18px;align-items:center;margin-top:46px;color:#817d79;font-size:10px;letter-spacing:.07em;white-space:nowrap}

.luxury-visual:after{content:"";position:absolute;inset:0;border:9px solid #08080a16;pointer-events:none;z-index:1}
.visual-micro{position:absolute;top:22px;left:28px;right:24px;display:flex;justify-content:space-between;gap:12px;color:#e9dcc8;text-shadow:0 2px 7px #0008;letter-spacing:.21em;font-size:10px;z-index:2}
.visual-micro span{color:#d3bf9e}
.visual-signal{position:absolute;bottom:58px;left:32px;right:32px;background:linear-gradient(120deg,#101316ed,#16191de8);border:1px solid #5d4b38d1;padding:24px 28px 18px;backdrop-filter:blur(20px);z-index:3;max-width:475px}
.micro-gold{color:#d2ad7e!important;font-size:10px!important;font-weight:650;letter-spacing:.2em!important;text-transform:uppercase;margin:0 0 10px!important}
.visual-signal>strong{font-family:Georgia,serif;font-size:clamp(40px,4vw,59px);font-weight:400;line-height:1.1;letter-spacing:-.03em;color:#f4e6d0;display:block}
.visual-signal>strong span{font:normal 12px Inter,"Segoe UI",sans-serif;color:#b7a997;letter-spacing:.02em}
.visual-signal>p:not(.micro-gold){font-size:11px;color:#a59d92;margin:10px 0 20px}
.visual-signal-line{height:1px;width:100%;background:linear-gradient(90deg,#b89a74,#48413a);opacity:.8}
.signal-foot{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:12px;color:#e0d3be;font-size:11px}
.signal-foot button{height:31px;width:31px;display:grid;place-items:center;color:#e8c99d;border:1px solid #7f6950;background:transparent;border-radius:50%}
.signal-foot button:hover{background:#c8ae8b;color:#19130c}
.visual-caption{position:absolute;bottom:21px;left:30px;right:30px;font-size:8px;color:#aca49a;letter-spacing:.12em;z-index:2}
.luxury-verdict{display:grid;grid-template-columns:1.15fr repeat(3,1fr);border-block:1px solid #3c352d;margin-bottom:68px;min-height:185px;background:linear-gradient(90deg,#0e0f13,transparent);align-items:stretch}
.verdict-lead{padding:24px 26px 22px 0;display:flex;flex-direction:column;justify-content:center}
.verdict-lead h2{font:400 clamp(21px,2.2vw,34px)/1.16 Georgia,serif;letter-spacing:-.04em;margin:3px 0 0}
.verdict-lead h2 em{font-style:normal;color:#ceb28e}
.verdict-item{border-left:1px solid #342f2b;padding:23px clamp(14px,1.5vw,25px);display:flex;flex-direction:column;justify-content:center;min-width:0}
.verdict-item>p{font-size:10px;letter-spacing:.06em;color:#a9a198;line-height:1.4;margin:0 0 8px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.verdict-item>strong{font-family:Georgia,serif;font-weight:400;letter-spacing:-.055em;font-size:clamp(28px,2.9vw,50px);white-space:nowrap;color:#f0e9df}
.verdict-item>small{font-size:9px;line-height:1.55;color:#777674;margin-top:6px}
.verdict-status{font-size:8px;border:1px solid #615443;color:#d3b38b;padding:3px 6px;letter-spacing:.08em}
.verdict-status.subdued{border-color:#404044;color:#aaa09b}
.luxury-section-intro{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:0 0 23px}
.luxury-section-intro h2{font-family:Georgia,serif;font-size:clamp(26px,2.8vw,42px);font-weight:400;letter-spacing:-.04em;line-height:1.2;margin:0;max-width:760px}
.luxury-section-intro h2 em{color:#d5b88f;font-style:normal}
.luxury-section-intro .eyebrow{color:#9d8871}
.luxury-quiet-link{border:0;border-bottom:1px solid #6e5d47;background:none;padding:11px 2px;color:#e8d1b0;display:inline-flex;gap:12px;align-items:center;font-size:11px;white-space:nowrap}
.luxury-quiet-link:hover{color:white}
.luxury-filters{border:1px solid #292a2c;border-radius:9px;background:#101216;margin-bottom:15px;padding:16px 18px 10px}
.filter-head{display:flex;justify-content:space-between;gap:18px;color:#77736f;font-size:9px;letter-spacing:.1em;margin-bottom:10px}
.filter-head>span:first-child{color:#bfa98f}
.filters{margin:0;gap:9px;min-width:0}
.filters select,.small-field input{background:#181a20;border:1px solid #3b3937;color:#d6d0c8;border-radius:5px;min-height:38px;font-size:11px}
.filters .segmented{border:1px solid #3a3633;background:#131417;border-radius:6px;padding:3px;display:flex;align-items:center}
.filters .segmented button{background:transparent;border:0;color:#a09a94;border-radius:4px;padding:8px 11px;font-size:10px;white-space:nowrap}
.filters .segmented button:hover,.filters .segmented button.active{color:#f5e7d4;background:#3b3027}
/* Detailed data has white space and a disciplined visual scale. */
.kpi-grid{margin-top:0;gap:11px}.kpi-card,.panel{background:linear-gradient(145deg,#13161b,#0f1116);border:1px solid #303036;border-radius:10px;box-shadow:none}
.kpi-card{min-height:145px;padding:22px}
.kpi-top{color:#ada59e}.kpi-top span{font-size:11px}.kpi-value{font-family:Georgia,serif;letter-spacing:-.055em;font-weight:400;color:#f4eee5;font-size:clamp(27px,2.35vw,40px)}
.kpi-foot{color:#8a8580;font-size:10px;line-height:1.5}.tiny-status{border-color:#44403b;color:#c4ac8a}
.lower-section{margin-top:14px;gap:13px}
.panel{padding:25px}
.section-title h2{font-family:Georgia,serif;font-size:26px;font-weight:400;letter-spacing:-.035em}
.section-title .eyebrow,.page-heading .eyebrow,.eyebrow{color:#b6a085;font-size:9.5px;letter-spacing:.2em}
.section-title p,.page-heading .heading-sub{color:#99948e}
.page-heading h1{font-family:Georgia,serif;font-weight:400;letter-spacing:-.045em}
.page-heading h1 em{font-style:normal}
.btn-primary{background:#ccad83;border:1px solid #e8c79b;color:#181411;box-shadow:none;border-radius:5px;font-weight:700}
.btn-outline,.btn-small{border:1px solid #5d4d39;background:#1a1918;color:#ecd6b8;border-radius:5px}
.btn-outline:hover,.btn-small:hover{background:#30261e;color:#fff}
.icon-btn{background:#24221e;border:1px solid #5a4b3a;color:#dfc49b}
.small-badge{background:#26211e;color:#d8bf9c;border-color:#544536}
.opportunity-visual{background:transparent}.opp-row{border-bottom:1px solid #333033}.opp-row:hover{background:#231e18}.opp-row.selected{background:#2b241c;border-color:#584631}
.opp-dot{background:#9c815e}.opp-back{background:#302b25}.opp-back span{background:linear-gradient(90deg,#7c674e,#c7a478)}
.opp-row strong{color:#e6d0af}.opportunity-info{background:#1c1b1b;border:1px solid #554938;color:#c9bdaf}
.opportunity-info h3{color:#ede6db}.opportunity-info .mini-label{color:#bda17d}
.line-chart svg path[stroke="#67e7c9"]{stroke:#c5a47d}.line-chart svg stop:first-child{stop-color:#a78b68}
.chart-big-number{color:#e8d7bd}.metrics-stack{border-color:#34302e}.metrics-stack>div{border-color:#34302e}
.luxury-next{display:flex;align-items:center;justify-content:space-between;gap:27px;margin:34px 0 0;padding:37px 40px;background:radial-gradient(circle at 70% 50%,#40301b55,transparent 57%),linear-gradient(112deg,#161618,#0e0e10);border:1px solid #5d4c37}
.luxury-next h2{font:400 clamp(27px,2.5vw,39px)/1.2 Georgia,serif;margin:6px 0 10px;letter-spacing:-.035em}
.luxury-next p:not(.micro-gold){color:#a6a09a;font-size:11px;margin:0}
.app-footer,.footer-source{color:#8a8278}
/* Five cinematic demo scenes, no neon gradients or decorative fireworks. */
.demo-page .demo-topline h1,.demo-screen h2{font-family:Georgia,serif;font-weight:400;letter-spacing:-.045em}
.demo-screen{background:radial-gradient(circle at 76% 10%,rgba(128,95,64,.15),transparent 47%),linear-gradient(125deg,#181a1d,#0d1014 82%);border:1px solid #4c4136;border-radius:9px;min-height:585px;padding:30px 35px 0}
.demo-screen:before{background:linear-gradient(110deg,transparent,#8a68420b,transparent)}
.demo-step{background:#121317;border-color:#34302e;color:#aea59b}.demo-step.current{background:#352a1e;color:#edd1a7;border-color:#82694b}
.demo-step.done{color:#d7b88c}.demo-step.current i,.demo-step.done i{background:var(--gold)}
.scene-counter{color:#c0ae93}.scene-counter span{color:#8e7355}
.overline i{background:var(--gold)}.overline{color:#beab93}
.scene-two .scene-right.panel{background:#151619}
.funnel-row{background:#1a1c21;border-color:#37332f;color:#ece4d8}.funnel-row:hover,.funnel-row.is-active{background:#322a21;border-color:#8d714e}
.funnel-track{background:#383029}.funnel-track>span{background:linear-gradient(90deg,#876f50,#e0c198)}
.funnel-order{color:#c7a882}.funnel-row>svg{color:#c6ad86}
.formula-box{border-color:#514436}.formula-box>span{color:#c8a77e}.formula-box strong i{color:#e4c89e}
.scene-insight{background:#28231d;border-color:#584835;color:#e1c7a1}
.jacket-spec{background:#1b1b1d;border-color:#554636}.jacket-silhouette{background:#242225;border-color:#5b4b3d}
.jacket-spec b{color:#dcb88a}.stock-panel{background:#16181c}.stock-pips i.filled{background:#c6a67b}
.projection-panel{background:linear-gradient(140deg,#24221d,#14171b)!important;border-color:#66523b!important}

<script>// MODULE model.mjs
/**
 * OSMANX Retail Intelligence — deterministic, self-contained synthetic data model.
 * Accounting facts, linked receipts and demand observations are kept separate from forecasts.
 * No fake network connections or fabricated production integrations.
 */
const AS_OF = '2026-11-08';
const STORES = Object.freeze([
  {id:'s1', name:'Центральный', short:'Филиал №1', district:'Центр'},
  {id:'s2', name:'Галерея', short:'Филиал №2', district:'Торговая галерея'},
  {id:'s3', name:'Парк', short:'Филиал №3', district:'Южный квартал'}
]);
const CATEGORIES = Object.freeze(['Куртки','Платья','Брюки','Обувь','Трикотаж','Рубашки']);
const SIZES = Object.freeze(['XS','S','M','L','XL']);
const SCENARIOS = Object.freeze([
  {id:'balanced',name:'Успешная сеть',factor:1,demand:1,service:1},
  {id:'operations',name:'Операционные сложности',factor:.88,demand:1.19,service:1.65},
  {id:'shortages',name:'Спрос выше доступности',factor:1.12,demand:1.85,service:1.08}
]);
const MONEY = n => new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(n||0))+' ₽';
const NUMBER = n => new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(n||0));
const PERCENT = n => Number.isFinite(n) ? (n*100).toLocaleString('ru-RU',{maximumFractionDigits:1})+'%' : '—';
const safeRatio = (a,b) => b>0 ? a/b : null;
function daysAgo(n) { const d=new Date(AS_OF+'T12:00:00.000Z'); d.setUTCDate(d.getUTCDate()-n); return d.toISOString().slice(0,10); }
const sum = (items, key) => items.reduce((t,r)=>t+(typeof key==='function'?key(r):r[key]||0),0);
function rnd(seed) { let s=seed>>>0;return ()=>((s=(1664525*s+1013904223)>>>0)/4294967296); }
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
const clamp=(x,min,max)=>Math.max(min,Math.min(max,x));
function buildCatalog() {
  const names={
    'Куртки':['AURA','NORD','MISTRAL','ECHO','NOVA','ATELIER','LUMEN'],
    'Платья':['SILK','MIRA','LUNA','FORMA','ELLE','SABLE','LINE'],
    'Брюки':['BASE','AXIS','FRAME','MOTION','TAILOR','EDGE','CORE'],
    'Обувь':['VECTOR','TERRA','URBAN','MONO','PRIME','LACE','KIN'],
    'Трикотаж':['MERINO','SOFT','CLOUD','BALANCE','MOSS','KNIT','WAVE'],
    'Рубашки':['OXFORD','PURE','CLASSIC','FINE','EASY','COTTON','MODE']
  };
  const base={'Куртки':8900,'Платья':7200,'Брюки':5200,'Обувь':7400,'Трикотаж':4400,'Рубашки':5100};
  const products=[];
  for (let i=0;i<300;i++) {
    const category=CATEGORIES[i%6], catIndex=Math.floor(i/6), name=names[category][catIndex%7], isAura=i===0;
    const price=isAura?8900:base[category]+((catIndex*19)%11)*360;
    const cost=isAura?4900:Math.round(price*(.48+((catIndex*3)%13)/100)/10)*10;
    products.push({id:isAura?'JKT-AURA':`SKU-${String(i+1).padStart(3,'0')}`,code:`${category.slice(0,2).toUpperCase()}-${String(i+1).padStart(3,'0')}`,name:isAura?'AURA / technical jacket':`${name} ${String(Math.floor(catIndex/7)+1).padStart(2,'0')}`,category,price,cost,colors:isAura?['Графит','Песочный']:['Графит','Светлый']});
  }
  return products;
}
const CATALOG=buildCatalog();
const AURA=CATALOG[0];
const modelMap=new Map(CATALOG.map(p=>[p.id,p]));
function product(id) {return modelMap.get(id)||AURA;}
function buildDataset(scenarioId='balanced') {
  const scenario=SCENARIOS.find(s=>s.id===scenarioId)||SCENARIOS[0];
  const r=rnd(761102+(scenarioId==='operations'?21:scenarioId==='shortages'?89:0));
  const sales=[],returns=[],traffic=[],requests=[],fittings=[],assistance=[],stock=[],transfers=[],audits=[],decisions=[],preorders=[],preferences=[];
  const byDateAndStore=new Map();let sId=0;
  for(let d=89;d>=0;d--)for(let si=0;si<3;si++) {
    const day=daysAgo(d),store=STORES[si],weekend=new Date(day+'T12:00:00Z').getUTCDay()%6===0;
    const visitors=Math.round((138+si*27+(weekend?65:0)+Math.floor(r()*45))*scenario.factor);
    const passers=Math.round(visitors*(2.65+r()*.6));
    traffic.push({id:`foot-${day}-${store.id}`,date:day,storeId:store.id,passers,visits:visitors,variant:d%18<9?'А':'Б'});
    const tickets=Math.max(4,Math.round(visitors*(.112+(r()-.5)*.05)));
    for(let j=0;j<tickets;j++) {
      const p=CATALOG[Math.floor(Math.pow(r(),1.12)*CATALOG.length)];
      const size=pick(r,SIZES),discount=r()<.18?(r()<.7?.1:.2):0;
      const paidPrice=Math.round(p.price*(1-discount));
      const memberId=r()<.42?`loy-${String(Math.floor(r()*190)+1).padStart(3,'0')}`:null;
      const sale={id:`sale-${++sId}`,date:day,storeId:store.id,modelId:p.id,size,color:pick(r,p.colors),paidPrice,cost:p.cost,discount,memberId,originRequestId:null};
      sales.push(sale);
      const key=day+'|'+store.id;
      if(!byDateAndStore.has(key))byDateAndStore.set(key,[]);
      byDateAndStore.get(key).push(sale);
    }
  }
  // Demand funnel: 60 observed requests -> 32 available solutions -> 18 opted-in -> 7 linked purchases.
  // The seven receipts show gross profit but NOT incrementality against a counterfactual.
  for(let i=0;i<60;i++) {
    const date=daysAgo(i%14),storeId=STORES[i%3].id,size=i<29?'L':i<47?'M':pick(r,SIZES);
    const req={id:`req-14-${String(i+1).padStart(3,'0')}`,date,storeId,modelId:i<41?AURA.id:CATALOG[(i*11+2)%CATALOG.length].id,size,color:'Графит',solutionFound:i<32,consent:i<18,purchased:i<7,saleId:null,source:'Запрос покупателя (добровольно)'};
    if(i<7) {
      req.modelId=AURA.id;
      const sold={id:`rescue-${i+1}`,date,storeId,modelId:AURA.id,size,color:'Графит',paidPrice:8900,cost:4900,discount:0,memberId:null,originRequestId:req.id};
      req.saleId=sold.id;
      sales.push(sold);
    }
    requests.push(req);
  }
  for(let i=0;i<210;i++) {
    const d=14+(i%76),date=daysAgo(d),p=CATALOG[(i*17+7)%CATALOG.length];
    const found=i%5!==0,consent=found&&i%4===0;
    requests.push({id:`req-old-${i+1}`,date,storeId:STORES[i%3].id,modelId:p.id,size:SIZES[i%5],color:'Графит',solutionFound:found,consent,purchased:false,saleId:null,source:'Запрос покупателя (добровольно)'});
  }
  if(scenarioId!=='balanced') {
    // Alternative presentations contain additional *synthetic* observations, never invented receipts.
    const extra=Math.round(60*(scenario.demand-1));
    for(let i=0;i<extra;i++) {
      const p=CATALOG[(i*29+3)%300];
      requests.push({id:`req-scenario-${i}`,date:daysAgo(i%14),storeId:STORES[i%3].id,modelId:scenarioId==='shortages'?AURA.id:p.id,size:SIZES[i%5],color:'Графит',solutionFound:false,consent:false,purchased:false,saleId:null,source:'Запрос покупателя (добровольно)'});
    }
  }
  // Returns reference valid receipts and happen on or after sale date.
  for (let i=0;i<sales.length;i++) {
    const sold=sales[i];
    if(sold.originRequestId||r()>.042)continue;
    const elapsed=Math.floor((Date.parse(AS_OF)-Date.parse(sold.date))/86400000);
    const date=daysAgo(Math.max(0,elapsed-Math.floor(r()*Math.min(12,elapsed+1))));
    returns.push({id:`return-${returns.length+1}`,date,storeId:sold.storeId,saleId:sold.id,modelId:sold.modelId,size:sold.size,refundedPrice:sold.paidPrice,reversedCost:sold.cost,reason:pick(r,['Не подошёл размер','Качество','Передумал','Цвет','Повторный дефект']),source:'Зарегистрированный возврат'});
  }
  // Fitting outcomes are discrete observations, with explicitly recorded vs assumed reasons.
  for(let i=0;i<900;i++) {
    const date=daysAgo(i%90),storeId=STORES[i%3].id,p=CATALOG[(i*31+5)%300];
    const purchased=r()<.46,reason=purchased?null:pick(r,['Посадка','Цена','Нужен другой размер','Не указан','Фасон']);
    const matching=(byDateAndStore.get(date+'|'+storeId)||[]).find(s=>s.modelId===p.id);
    fittings.push({id:`fit-${i+1}`,date,storeId,modelId:p.id,size:SIZES[i%5],purchased,reason:reason==='Не указан'?null:reason,reasonType:reason==='Не указан'?'неизвестно':'со слов покупателя',saleId:purchased&&matching?matching.id:null});
  }
  for(let i=0;i<540;i++) {
    const date=daysAgo(i%90),storeId=STORES[i%3].id;
    const responseSeconds=Math.round((25+r()*170)*scenario.service*(i%9===0?2.3:1));
    assistance.push({id:`help-${i+1}`,date,storeId,modelId:CATALOG[(i*13)%300].id,requestType:pick(r,['Подбор размера','Проверка наличия','Помощь в примерочной']),responseSeconds,resolved:responseSeconds<240||r()>.3,source:'QR-запрос помощи'});
  }
  for(const p of CATALOG)for(const store of STORES)for(const size of SIZES)for(const color of p.colors) {
    let qty=Math.floor(r()*6);
    if(p.id===AURA.id&&size==='L'&&color==='Графит')qty=store.id==='s2'?3:store.id==='s1'?0:2;
    if(scenarioId==='shortages'&&store.id==='s1'&&['L','M'].includes(size))qty=Math.max(0,qty-2);
    stock.push({id:`stock-${p.id}-${store.id}-${size}-${color}`,modelId:p.id,storeId:store.id,size,color,quantity:qty,source:'Синтетический снимок остатков',asOf:AS_OF});
  }
  for(let i=0;i<120;i++) {
    const p=CATALOG[(i*23+9)%300],date=daysAgo((i*7)%90);
    transfers.push({id:`move-${i+1}`,date,modelId:p.id,size:SIZES[i%5],fromStoreId:STORES[i%3].id,toStoreId:STORES[(i+1)%3].id,quantity:1+(i%3),cost:220+(i%4)*80,status:pick(r,['Выполнено','В пути','Ожидает проверки'])});
  }
  for(let i=0;i<75;i++) {
    const item=stock[(i*117+71)%stock.length];
    audits.push({id:`audit-${i+1}`,date:daysAgo(i%90),modelId:item.modelId,storeId:item.storeId,size:item.size,expected:item.quantity,observed:Math.max(0,item.quantity+(i%2?1:-1)),status:i%3===0?'Проверено':'Требует сверки'});

    const p=CATALOG[(i*7+31)%300];

  }
  for(let i=0;i<220;i++) {
    const p=CATALOG[(i*13+5)%300];
    preferences.push({id:`pref-${i+1}`,date:daysAgo(i%90),storeId:STORES[i%3].id,modelId:p.id,size:SIZES[(i+2)%5],intent:i%3===0?'Готов рассмотреть':'Интересуется',source:'Добровольный опрос'});
  }
  // Confirmed business operation != independently proven attributable improvement.
  decisions.push({id:'act-1',name:'Уведомления о размере AURA',date:daysAgo(3),status:'Завершено',evidenceIds:requests.slice(0,7).map(x=>x.id),linkedSales:7,cost:1800});
  decisions.push({id:'act-2',name:'Проверка спорных остатков',date:daysAgo(6),status:'В работе',evidenceIds:audits.slice(0,12).map(x=>x.id),linkedSales:0,cost:950});
  return {scenarioId,scenario,products:CATALOG,stores:STORES,sales,returns,traffic,requests,fittings,assistance,stock,transfers,audits,preorders,preferences,decisions,generatedAt:AS_OF};
}
function scopeData(data,filter={}) {
  const days=filter.period==='custom'?null:Math.max(1,Number(filter.period)||14);

    if(filter.store&&filter.store!=='all'&&e.storeId!==filter.store)return false;
    if(filter.category&&filter.category!=='all'&&product(e.modelId).category!==filter.category)return false;
    if(filter.model&&filter.model!=='all'&&e.modelId!==filter.model)return false;
    if(filter.size&&filter.size!=='all'&&e.size!==filter.size)return false;
    return true;
  };

function sceneThree(sc){const jacketRequests=sc.requests.filter(e=>e.modelId===AURA.id),l=jacketRequests.filter(e=>e.size==='L'),stock=data.stock.filter(x=>x.modelId===AURA.id&&x.size==='L'&&x.color==='Графит');return `<div class="scene-three"><div class="scene-left"><p class="overline"><i></i> СЦЕНА 03 / ГДЕ ТЕРЯЕТСЯ СПРОС</p><h2>Нужный размер отсутствует здесь.<br><em>Но есть в другом филиале.</em></h2><p>Пример: техническая куртка AURA, графит. Связаны запросы размера, модель товара и снимок остатков сети.</p><div class="jacket-spec"><div class="jacket-silhouette">${jacketSvg()}</div><div><p class="mini-label">МОДЕЛЬ · JKT-AURA</p><h3>AURA / technical jacket</h3><span>Графит · Размер L · Цена ${MONEY(AURA.price)}</span><b>${NUMBER(l.length)} запросов размера L за 14 дней</b></div></div></div><div class="scene-right"><div class="panel stock-panel"><div class="section-title"><div><p class="eyebrow">LIVE SNAPSHOT · SYNTHETIC</p><h3>Доступность размера L</h3></div><span class="small-badge">Снимок ${AS_OF}</span></div>${STORES.map(store=>{const s=stock.find(x=>x.storeId===store.id);return `<div class="stock-row"><span class="stock-name">${store.short}<small>${store.name}</small></span><span class="stock-pips">${Array.from({length:4},(_,i)=>`<i class="${i<(s?.quantity||0)?'filled':''}"></i>`).join('')}</span><b class="${s?.quantity?'mint':'red'}">${s?.quantity||0} шт.</b></div>`}).join('')}<p class="stock-note">Наличие по снимку требует подтверждения сотрудником перед резервом или перемещением.</p></div><div class="scene-insight">${icon('target',19)} <span>Клиент в филиале №1 может не знать, что размер есть в филиале №2.</span></div></div></div>`;}
function jacketSvg(){return `<svg width="126" height="148" viewBox="0 0 126 148" fill="none" aria-label="Схематичный силуэт куртки"><path d="m40 17 15 6h16l15-6 18 16 18 48-16 9-13-22v65H32V68L19 90 4 81 22 33z" fill="#273648" stroke="#688599" stroke-width="1.5"/><path d="M55 23 63 44l8-21M63 44v89M32 72l-6 61M93 72l7 61" stroke="#8ba7b8" stroke-opacity=".55"/><path d="M55 24 49 18l-8 7 22 29 22-29-8-7-6 6" fill="#192939" stroke="#607888"/><path d="M76 70h10v8H76z" fill="#445f72"/></svg>`;}

function metric(label,value,caption,status){return `<div class="module-stat"><span>${label}</span><strong>${value}</strong><small>${caption}</small>${status?sourceTag(status):''}</div>`;}
function countsBy(items,key){const m=new Map();items.forEach(x=>m.set(x[key]??'Не указан',(m.get(x[key]??'Не указан')||0)+1));return [...m].sort((a,b)=>b[1]-a[1]).slice(0,7).map(([label,value])=>({label:String(label),value}));}
function stepCards(source,cost,decision,result){return `<div class="five-step-grid">${[['01','СИГНАЛ',source],['02','ДОКАЗАТЕЛЬСТВА','Данные ниже, доступен просмотр конкретных событий'],['03','ФИНАНСОВЫЙ ВЫВОД',cost],['04','РЕШЕНИЕ',decision],['05','РЕЗУЛЬТАТ',result]].map(([n,title,desc])=>`<div class="method-step"><span>${n} / ${title}</span><p>${desc}</p></div>`).join('')}</div>`;}

];return `${renderHeading('1С остаётся. <em>Добавляются вопросы.</em>','DATA ORIGINS / TRUST','Учётная система может быть источником фактов. OSMANX объединяет их с новыми событиями и помогает проверить решения.')}<section class="panel source-panel"><div class="section-title"><div><p class="eyebrow">DATA SOURCE MATRIX</p><h2>Что откуда действительно известно</h2></div>${icon('shield',23)}</div><div class="table-scroll"><table><thead><tr><th>Показатель</th><th>Источник</th><th>Можно получить из учёта?</th><th>Качество вывода</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="integration-note">${icon('lock',19)} <div><strong>1С не подключена в этой демонстрации.</strong><p>Здесь нет фиктивных API, имитации реальных синхронизаций или пользовательских коммерческих данных. Для подключения нужны согласование формата выгрузки, права и контроль качества.</p></div></div></section><section class="source-cards"><div><p class="eyebrow">ФАКТ</p><h3>Подтверждаемое событие</h3><p>Чек, зарегистрированный запрос, физическая сверка, возврат или согласие.</p></div><div><p class="eyebrow">ОЦЕНКА</p><h3>Модель с параметрами</h3><p>Считаем сумму и раскрываем допущения, но не называем предотвращённым убытком.</p></div><div><p class="eyebrow">ГИПОТЕЗА</p><h3>Вопрос для пилота</h3><p>Проверяем причинность контролируемым измерением и отслеживанием расходов.</p></div></section>`;}
function renderFooter(){return `<footer class="app-footer"><span>© OSMANX WORLD · RETAIL INTELLIGENCE / EXECUTIVE EDITION</span><span>Демонстрационные данные · По состоянию на ${AS_OF}</span></footer>`;}
function render(){root.innerHTML=`${renderSidebar()}<div class="workspace">${renderTopbar()}<main class="main-content">${state.page==='dashboard'?renderDashboard():state.page==='demo'?renderDemo():state.page.startsWith('module:')?renderModule(state.moduleIndex):state.page==='decisions'?renderDecisions():state.page==='calculator'?renderCalculator():state.page==='diagnostic'?renderDiagnostic():state.page==='presentation'?renderPresentation():renderSources()}</main>${state.page==='presentation'?'':renderFooter()}</div>${state.toast?`<div class="toast" role="status">${icon('check',17)} ${esc(state.toast)}<button data-action="dismiss-toast" aria-label="Закрыть" type="button">${icon('close',15)}</button></div>`:''}`;document.title=`${pageTitle()} — OSMANX Retail Intelligence`;}
function stopAuto(){state.auto=false;if(timer){clearInterval(timer);timer=null;}}
const DURATIONS=[5000,6000,7000,7000,5000];
function startAuto(){stopAuto();state.auto=true;state.stageStart=performance.now();timer=setInterval(()=>{const elapsed=performance.now()-state.stageStart;const progress=(DURATIONS.slice(0,state.scene).reduce((a,b)=>a+b,0)+Math.min(elapsed,DURATIONS[state.scene]))/30000;const el=document.getElementById('demo-progress-fill');if(el)el.style.width=`${(100*progress).toFixed(2)}%`;if(elapsed>=DURATIONS[state.scene]){if(state.scene===4){stopAuto();render();}else{state.scene++;state.stageStart=performance.now();render();}}},75);render();}
function goto(page){stopAuto();state.page=page;state.mobileOpen=false;state.lastVerification=null;if(page.startsWith('module:')){state.moduleIndex=Number(page.split(':')[1])||0;state.page='module:'+state.moduleIndex;}if(page==='demo')state.scene=0;render();if(window.location&&window.location.hash!=='#'+page)window.location.hash='#'+page;window.scrollTo?.({top:0,behavior:'instant'});}
function sceneChange(n){const wasPlaying=state.auto;stopAuto();state.scene=Math.max(0,Math.min(4,n));render();if(wasPlaying)startAuto();}
function toast(message){state.toast=message;render();}
function handleClick(event){const target=event.target.closest('button[data-action],button[data-page]');if(!target||target.disabled)return;
 if(target.dataset.page){goto(target.dataset.page);return;}
 const a=target.dataset.action,value=target.dataset.value;
 if(a==='toggle-menu'){state.mobileOpen=!state.mobileOpen;render();}
 else if(a==='period'){state.period=value;render();}
 else if(a==='opp-select'){state.opp=target.dataset.id;render();}
 else if(a==='scene'){sceneChange(Number(value));}
 else if(a==='next-scene'){sceneChange(state.scene===4?0:state.scene+1);}
 else if(a==='prev-scene'){sceneChange(state.scene-1);}
 else if(a==='restart-demo'){sceneChange(0);}
 else if(a==='toggle-auto'){if(state.auto){stopAuto();render();}else startAuto();}
 else if(a==='funnel-stage'){state.funnelStage=target.dataset.stage;render();}
 else if(a==='verify-transfer'){state.lastVerification=forecastTransfer({units:state.transferUnits,probability:state.transferProbability/100,costPerUnit:state.transferCost});render();}
 else if(a==='track-decision'){state.decisionState[target.dataset.decision]=AS_OF;persist();state.toast='Добавлено в план проверки. Финансовый результат ещё не измерен.';render();}
 else if(a==='track-opp'){state.decisionState['opp-'+target.dataset.id]=AS_OF;persist();state.toast='Гипотеза добавлена в план проверки.';render();}
 else if(a==='answer'){state.answers[target.dataset.key]=value;persist();render();}
 else if(a==='next-q'){const q=QUESTION_DEFS[state.qStep];if(!state.answers[q.key])return;if(state.qStep===6)state.diagnosticDone=true;else state.qStep++;render();}
 else if(a==='prev-q'){state.qStep=Math.max(0,state.qStep-1);render();}
 else if(a==='restart-diagnostic'){state.answers={};state.qStep=0;state.diagnosticDone=false;persist();render();}
 else if(a==='pdf'){exportPdf({answers:state.answers,plan:diagnosticPlan(state.answers),date:AS_OF});state.toast='PDF-отчёт подготовлен к сохранению';render();}
 else if(a==='presentation-panel'){state.presentationPanel=value;render();}
 else if(a==='reset-calc'){state.calculator={stores:3,requestsPerStore:20,conversion:12,avgTicket:8900,costPerSale:4900,pilotCost:15000};render();}
 else if(a==='dismiss-toast'){state.toast=null;render();}
 else if(a==='select-bar'){state.toast='Столбец: '+(target.title||'события');render();}
}
function preserveRerender(element,fn){const active=document.activeElement===element,selector=element.dataset.calc?`[data-calc="${element.dataset.calc}"]`:`[data-field="${element.dataset.field}"]`;let start=null,end=null;try{start=element.selectionStart;end=element.selectionEnd}catch{}fn();render();if(active){const replacement=root.querySelector(selector);if(replacement){replacement.focus();try{if(start!=null)replacement.setSelectionRange(start,end)}catch{}}}}
function handleField(element){const f=element.dataset.field;
 if(f){if(f==='scenario'){state.scenario=element.value;data=buildDataset(element.value);state.opp='demand';state.funnelStage='request';state.page='dashboard';render();return;}
  if(['period','store','category','model','size','from','to'].includes(f)){state[f]=element.value;if(f==='category')state.model='all';if(f==='from'&&state.from>state.to)state.to=state.from;if(f==='to'&&state.to<state.from)state.from=state.to;render();return;}
  if(['transferUnits','transferProbability','transferCost'].includes(f)){state[f]=Number(element.value);state.lastVerification=null;render();return;}}
 if(element.dataset.calc){const k=element.dataset.calc;const raw=Number(element.value);preserveRerender(element,()=>{state.calculator[k]=Number.isFinite(raw)?raw:0});}
}
root.addEventListener('click',handleClick);
root.addEventListener('change',e=>{if(e.target.matches('[data-field]'))handleField(e.target);});
root.addEventListener('input',e=>{if(e.target.matches('[data-calc]'))handleField(e.target);});
// Expose *read-only* deterministic verification hooks to browser smoke tests.
if(window.addEventListener){window.addEventListener('keydown',event=>{if(state.page==='demo'&&['ArrowRight','ArrowLeft',' '].includes(event.key)&&!['INPUT','SELECT','TEXTAREA'].includes(event.target?.tagName)){event.preventDefault();if(event.key===' ')state.auto?stopAuto():startAuto();else sceneChange(state.scene+(event.key==='ArrowRight'?1:-1));if(event.key===' '&&!state.auto)render();}if(event.key==='Escape'&&state.mobileOpen){state.mobileOpen=false;render();}});window.addEventListener('hashchange',()=>{const next=decodeURIComponent(window.location.hash.slice(1));if(next&&next!==state.page&&(NAV.flatMap(x=>x.items).some(([id])=>id===next)||next==='sources'))goto(next);});}
if(window.location?.hash){const route=decodeURIComponent(window.location.hash.slice(1));if(NAV.flatMap(x=>x.items).some(([id])=>id===route)){state.page=route;if(route.startsWith('module:'))state.moduleIndex=Number(route.split(':')[1])||0;}}
window.__OSMANX_DIAGNOSTICS__={get state(){return {page:state.page,scene:state.scene,scenario:state.scenario}},get totals(){return scoped().totals},get dataset(){return {products:data.products.length,days:90,stores:data.stores.length}},navigate:goto};
render();
</script></body></html>
