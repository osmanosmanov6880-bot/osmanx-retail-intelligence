/* OSMANX EXECUTIVE R2 — ATELIER. Presentation-first, deliberately quiet. */
:root{
 color-scheme:dark;
 --bg:#080a0e;--bg2:#0b0d12;--panel:#101318;--panel2:#13171d;
 --ink:#f2f0eb;--muted:#a29f9b;--dim:#716f70;
 --stroke:#292c32;--stroke2:#24272d;--gold:#cbb18b;--gold-bright:#f1d6a8;
 --mint:#d8c09b;--mint2:#c6ae8a;--red:#c47b80;
 --sidebar:0px;--radius:12px;
 font-family:Inter,"Segoe UI",Arial,sans-serif;
}
body{background:#080a0e;color:var(--ink);letter-spacing:-.003em;overflow-x:hidden}
#app{min-width:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px}
em,.page-heading h1 em{color:var(--gold)!important}
.workspace{margin-left:0;max-width:100%;background:radial-gradient(ellipse 48% 32% at 91% 1%,rgba(79,64,47,.16),transparent 85%),#080a0e}
.main-content{width:100%;max-width:1770px;padding:38px clamp(20px,3.5vw,68px) 62px;margin:0 auto}
/* A proper navigation drawer rather than a permanent 250px sidebar. */
.sidebar{width:300px;max-width:min(90vw,345px);background:linear-gradient(155deg,#121317,#090b0f);border-right:1px solid #3a332c;transform:translateX(-105%);transition:transform .25s ease;visibility:hidden;box-shadow:32px 0 80px #0008;z-index:55}
.sidebar.is-open{transform:translateX(0);visibility:visible}
.sidebar .brand{padding:16px 0;gap:13px}
.sidebar .brand-mark span:first-child{background:linear-gradient(150deg,#e6d5bf,#9f7f58)}
.sidebar .brand-mark span:last-child{background:linear-gradient(150deg,#e9d9c3,#8b7155)}
.brand-name{font-family:Georgia,serif;letter-spacing:.12em;font-size:23px;font-weight:500}
.brand-name span{color:inherit}
.brand-sub{font-size:8px;letter-spacing:.21em;color:#b7a28a}
.drawer-top{display:flex;justify-content:space-between;align-items:center;padding:18px 21px 11px;border-bottom:1px solid #2a2828}
.drawer-close{display:grid;place-items:center;height:36px;width:36px;background:none;border:1px solid #36363a;border-radius:50%;color:#c9c7c0}
.drawer-close:hover{color:#f3dfc3;border-color:#8c7357}
.drawer-intro{padding:23px 23px 5px;font-size:10px;letter-spacing:.21em;color:#8d8174}
.sidebar-nav{padding:4px 13px 24px}
.nav-group-title{font-size:9px;color:#887969;font-weight:600;letter-spacing:.17em}
.nav-link{font-size:12px;min-height:42px;padding:11px 12px;border-radius:6px;color:#bbb9b5}
.nav-link:hover{background:#24211d;color:#fff}
.nav-link.active{background:linear-gradient(90deg,rgba(165,125,76,.16),rgba(165,125,76,.03));border-color:#584532;color:#f1dbc1}
.nav-link.active>svg{color:var(--gold)}.nav-link.active>i{background:var(--gold)}
.sidebar-bottom{border-top:1px solid #333037}.sidebar-bottom p{font-size:9px;color:#857b6f}
.demo-mini-dot{background:var(--gold);box-shadow:none}.demo-source{color:#a59a8e}
.mobile-backdrop{display:block;position:fixed;inset:0;background:#030406cf;backdrop-filter:blur(7px);z-index:50;border:0}
/* Understated boardroom masthead */
.topbar{min-height:78px;padding:0 clamp(20px,3.5vw,68px);border-bottom:1px solid #2b2a2a;background:#0a0b0edb;backdrop-filter:blur(22px);box-shadow:none;gap:16px}
.topbar-left{gap:17px;min-width:0}.topbar-right{gap:15px;min-width:0}
.mobile-menu.nav-trigger{display:grid;place-items:center;width:37px;height:37px;border:1px solid #343238;border-radius:50%;background:transparent;color:#d5d2cc;flex-shrink:0}
.mobile-menu.nav-trigger:hover{background:#25211c;color:#f0ddbe;border-color:#8e7859}
.header-brand{display:flex;align-items:center;gap:12px;color:#f5f0e8;background:none;border:none;padding:0;text-align:left;white-space:nowrap}
.header-x{font-family:Georgia,serif;font-size:31px;transform:skewX(-13deg);color:var(--gold-bright);font-weight:bold;line-height:1.1}
.header-brand-text{display:flex;flex-direction:column;gap:4px}
.header-brand-text b{font-family:Georgia,serif;letter-spacing:.18em;font-size:19px;font-weight:500}
.header-brand-text small{font-size:8px;letter-spacing:.25em;color:#ada397}
.header-rule{width:1px;height:27px;background:#37312a;margin:0 8px 0 12px;flex-shrink:0}
.header-nav{display:flex;align-items:center;gap:clamp(7px,1.7vw,28px)}
.header-nav button{background:none;border:0;color:#aba9a6;font-size:11px;text-transform:uppercase;letter-spacing:.14em;padding:16px 6px;white-space:nowrap}
.header-nav button:hover,.header-nav button.on{color:var(--gold-bright)}
.header-nav button.on:after{content:"";display:block;height:1px;background:#ab855f;margin-top:8px}
.topbar .global-demo{display:flex!important;align-items:center;gap:8px;color:#b1a796;font-size:9px;letter-spacing:.07em;white-space:nowrap}
.global-demo i{width:5px;height:5px;background:var(--gold)}
.topbar .scenario-select{font-size:10px;color:#d1c5b5;min-width:132px;max-width:228px;padding:9px 9px;background:#15161a;border:1px solid #34302e;border-radius:6px}
.top-demo-btn{background:linear-gradient(130deg,#d8bd98,#b69b74);border:1px solid #ead2ac;color:#141311;font-size:10.5px;letter-spacing:.015em;font-weight:700;border-radius:6px;padding:12px 14px;gap:8px}
.top-demo-btn:hover,.btn-primary:hover{background:#f3dab4;color:#1b1711}
/* Hero is a real piece of interface: not a rasterized mockup of the app. */
.luxury-hero{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,.96fr);gap:clamp(20px,3.3vw,53px);align-items:stretch;min-height:540px;margin:0 0 26px;position:relative}
.luxury-copy{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-width:0;padding:31px 0 20px}
.luxury-kicker{display:flex;align-items:center;gap:13px;letter-spacing:.24em;font-size:10px;color:#c8b7a0;font-weight:600;margin:0 0 38px;white-space:nowrap}
.luxury-kicker>span:last-child{margin-left:8px;color:#67635f;letter-spacing:.12em}
.kicker-line{height:1px;width:30px;background:var(--gold)}
.luxury-page-name{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#918a80;margin-bottom:16px}
.luxury-copy h1{font-family:"Iowan Old Style","Baskerville","Times New Roman",Georgia,serif;letter-spacing:-.055em;font-weight:400;font-size:clamp(42px,4.5vw,76px);line-height:1.07;margin:0;max-width:850px;text-wrap:balance}
.luxury-copy h1 em{color:#d9b888!important;font-style:normal}
.luxury-lead{max-width:545px;color:#a29f9b;font-size:clamp(12px,1.03vw,15px);line-height:1.9;letter-spacing:.005em;margin:25px 0 30px}
.luxury-actions{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.luxury-primary{display:inline-flex;align-items:center;justify-content:center;gap:16px;background:linear-gradient(115deg,#e6cfaa,#c6a477);border:1px solid #e1c499;border-radius:5px;color:#181510;padding:14px 18px;font-size:12px;font-weight:720;white-space:nowrap;min-height:51px;box-shadow:0 8px 30px #88653822}
.luxury-primary:hover{background:linear-gradient(115deg,#fff0cf,#d6b68b);color:#15110d;transform:translateY(-1px)}
.button-play{height:21px;width:21px;display:grid;place-items:center;border:1px solid #35291e;border-radius:50%}
.luxury-secondary{display:inline-flex;align-items:center;gap:12px;background:transparent;border:1px solid #4b4238;border-radius:5px;color:#ead8bc;padding:15px 17px;min-height:51px;font-size:12px}
.luxury-secondary:hover{border-color:#af9677;background:#1d1915}
.luxury-proofline{display:flex;gap:18px;align-items:center;margin-top:46px;color:#817d79;font-size:10px;letter-spacing:.07em;white-space:nowrap}

.luxury-visual:after{content:"";position:absolute;inset:0;border:9px solid #08080a16;pointer-events:none;z-index:1}
.visual-micro{position:absolute;top:22px;left:28px;right:24px;display:flex;justify-content:space-between;gap:12px;color:#e9dcc8;text-shadow:0 2px 7px #0008;letter-spacing:.21em;font-size:10px;z-index:2}
.visual-micro span{color:#d3bf9e}
.visual-signal{position:absolute;bottom:58px;left:32px;right:32px;background:linear-gradient(120deg,#101316ed,#16191de8);border:1px solid #5d4b38d1;padding:24px 28px 18px;backdrop-filter:blur(20px);z-index:3;max-width:475px}
.micro-gold{color:#d2ad7e!important;font-size:10px!important;font-weight:650;letter-spacing:.2em!important;text-transform:uppercase;margin:0 0 10px!important}
.visual-signal>strong{font-family:Georgia,serif;font-size:clamp(40px,4vw,59px);font-weight:400;line-height:1.1;letter-spacing:-.03em;color:#f4e6d0;display:block}
.visual-signal>strong span{font:normal 12px Inter,"Segoe UI",sans-serif;color:#b7a997;letter-spacing:.02em}
.visual-signal>p:not(.micro-gold){font-size:11px;color:#a59d92;margin:10px 0 20px}
.visual-signal-line{height:1px;width:100%;background:linear-gradient(90deg,#b89a74,#48413a);opacity:.8}
.signal-foot{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:12px;color:#e0d3be;font-size:11px}
.signal-foot button{height:31px;width:31px;display:grid;place-items:center;color:#e8c99d;border:1px solid #7f6950;background:transparent;border-radius:50%}
.signal-foot button:hover{background:#c8ae8b;color:#19130c}
.visual-caption{position:absolute;bottom:21px;left:30px;right:30px;font-size:8px;color:#aca49a;letter-spacing:.12em;z-index:2}
.luxury-verdict{display:grid;grid-template-columns:1.15fr repeat(3,1fr);border-block:1px solid #3c352d;margin-bottom:68px;min-height:185px;background:linear-gradient(90deg,#0e0f13,transparent);align-items:stretch}
.verdict-lead{padding:24px 26px 22px 0;display:flex;flex-direction:column;justify-content:center}
.verdict-lead h2{font:400 clamp(21px,2.2vw,34px)/1.16 Georgia,serif;letter-spacing:-.04em;margin:3px 0 0}
.verdict-lead h2 em{font-style:normal;color:#ceb28e}
.verdict-item{border-left:1px solid #342f2b;padding:23px clamp(14px,1.5vw,25px);display:flex;flex-direction:column;justify-content:center;min-width:0}
.verdict-item>p{font-size:10px;letter-spacing:.06em;color:#a9a198;line-height:1.4;margin:0 0 8px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.verdict-item>strong{font-family:Georgia,serif;font-weight:400;letter-spacing:-.055em;font-size:clamp(28px,2.9vw,50px);white-space:nowrap;color:#f0e9df}
.verdict-item>small{font-size:9px;line-height:1.55;color:#777674;margin-top:6px}
.verdict-status{font-size:8px;border:1px solid #615443;color:#d3b38b;padding:3px 6px;letter-spacing:.08em}
.verdict-status.subdued{border-color:#404044;color:#aaa09b}
.luxury-section-intro{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:0 0 23px}
.luxury-section-intro h2{font-family:Georgia,serif;font-size:clamp(26px,2.8vw,42px);font-weight:400;letter-spacing:-.04em;line-height:1.2;margin:0;max-width:760px}
.luxury-section-intro h2 em{color:#d5b88f;font-style:normal}
.luxury-section-intro .eyebrow{color:#9d8871}
.luxury-quiet-link{border:0;border-bottom:1px solid #6e5d47;background:none;padding:11px 2px;color:#e8d1b0;display:inline-flex;gap:12px;align-items:center;font-size:11px;white-space:nowrap}
.luxury-quiet-link:hover{color:white}
.luxury-filters{border:1px solid #292a2c;border-radius:9px;background:#101216;margin-bottom:15px;padding:16px 18px 10px}
.filter-head{display:flex;justify-content:space-between;gap:18px;color:#77736f;font-size:9px;letter-spacing:.1em;margin-bottom:10px}
.filter-head>span:first-child{color:#bfa98f}
.filters{margin:0;gap:9px;min-width:0}
.filters select,.small-field input{background:#181a20;border:1px solid #3b3937;color:#d6d0c8;border-radius:5px;min-height:38px;font-size:11px}
.filters .segmented{border:1px solid #3a3633;background:#131417;border-radius:6px;padding:3px;display:flex;align-items:center}
.filters .segmented button{background:transparent;border:0;color:#a09a94;border-radius:4px;padding:8px 11px;font-size:10px;white-space:nowrap}
.filters .segmented button:hover,.filters .segmented button.active{color:#f5e7d4;background:#3b3027}
/* Detailed data has white space and a disciplined visual scale. */
.kpi-grid{margin-top:0;gap:11px}.kpi-card,.panel{background:linear-gradient(145deg,#13161b,#0f1116);border:1px solid #303036;border-radius:10px;box-shadow:none}
.kpi-card{min-height:145px;padding:22px}
.kpi-top{color:#ada59e}.kpi-top span{font-size:11px}.kpi-value{font-family:Georgia,serif;letter-spacing:-.055em;font-weight:400;color:#f4eee5;font-size:clamp(27px,2.35vw,40px)}
.kpi-foot{color:#8a8580;font-size:10px;line-height:1.5}.tiny-status{border-color:#44403b;color:#c4ac8a}
.lower-section{margin-top:14px;gap:13px}
.panel{padding:25px}
.section-title h2{font-family:Georgia,serif;font-size:26px;font-weight:400;letter-spacing:-.035em}
.section-title .eyebrow,.page-heading .eyebrow,.eyebrow{color:#b6a085;font-size:9.5px;letter-spacing:.2em}
.section-title p,.page-heading .heading-sub{color:#99948e}
.page-heading h1{font-family:Georgia,serif;font-weight:400;letter-spacing:-.045em}
.page-heading h1 em{font-style:normal}
.btn-primary{background:#ccad83;border:1px solid #e8c79b;color:#181411;box-shadow:none;border-radius:5px;font-weight:700}
.btn-outline,.btn-small{border:1px solid #5d4d39;background:#1a1918;color:#ecd6b8;border-radius:5px}
.btn-outline:hover,.btn-small:hover{background:#30261e;color:#fff}
.icon-btn{background:#24221e;border:1px solid #5a4b3a;color:#dfc49b}
.small-badge{background:#26211e;color:#d8bf9c;border-color:#544536}
.opportunity-visual{background:transparent}.opp-row{border-bottom:1px solid #333033}.opp-row:hover{background:#231e18}.opp-row.selected{background:#2b241c;border-color:#584631}
.opp-dot{background:#9c815e}.opp-back{background:#302b25}.opp-back span{background:linear-gradient(90deg,#7c674e,#c7a478)}
.opp-row strong{color:#e6d0af}.opportunity-info{background:#1c1b1b;border:1px solid #554938;color:#c9bdaf}
.opportunity-info h3{color:#ede6db}.opportunity-info .mini-label{color:#bda17d}
.line-chart svg path[stroke="#67e7c9"]{stroke:#c5a47d}.line-chart svg stop:first-child{stop-color:#a78b68}
.chart-big-number{color:#e8d7bd}.metrics-stack{border-color:#34302e}.metrics-stack>div{border-color:#34302e}
.luxury-next{display:flex;align-items:center;justify-content:space-between;gap:27px;margin:34px 0 0;padding:37px 40px;background:radial-gradient(circle at 70% 50%,#40301b55,transparent 57%),linear-gradient(112deg,#161618,#0e0e10);border:1px solid #5d4c37}
.luxury-next h2{font:400 clamp(27px,2.5vw,39px)/1.2 Georgia,serif;margin:6px 0 10px;letter-spacing:-.035em}
.luxury-next p:not(.micro-gold){color:#a6a09a;font-size:11px;margin:0}
.app-footer,.footer-source{color:#8a8278}
/* Five cinematic demo scenes, no neon gradients or decorative fireworks. */
.demo-page .demo-topline h1,.demo-screen h2{font-family:Georgia,serif;font-weight:400;letter-spacing:-.045em}
.demo-screen{background:radial-gradient(circle at 76% 10%,rgba(128,95,64,.15),transparent 47%),linear-gradient(125deg,#181a1d,#0d1014 82%);border:1px solid #4c4136;border-radius:9px;min-height:585px;padding:30px 35px 0}
.demo-screen:before{background:linear-gradient(110deg,transparent,#8a68420b,transparent)}
.demo-step{background:#121317;border-color:#34302e;color:#aea59b}.demo-step.current{background:#352a1e;color:#edd1a7;border-color:#82694b}
.demo-step.done{color:#d7b88c}.demo-step.current i,.demo-step.done i{background:var(--gold)}
.scene-counter{color:#c0ae93}.scene-counter span{color:#8e7355}
.overline i{background:var(--gold)}.overline{color:#beab93}
.scene-two .scene-right.panel{background:#151619}
.funnel-row{background:#1a1c21;border-color:#37332f;color:#ece4d8}.funnel-row:hover,.funnel-row.is-active{background:#322a21;border-color:#8d714e}
.funnel-track{background:#383029}.funnel-track>span{background:linear-gradient(90deg,#876f50,#e0c198)}
.funnel-order{color:#c7a882}.funnel-row>svg{color:#c6ad86}
.formula-box{border-color:#514436}.formula-box>span{color:#c8a77e}.formula-box strong i{color:#e4c89e}
.scene-insight{background:#28231d;border-color:#584835;color:#e1c7a1}
.jacket-spec{background:#1b1b1d;border-color:#554636}.jacket-silhouette{background:#242225;border-color:#5b4b3d}
.jacket-spec b{color:#dcb88a}.stock-panel{background:#16181c}.stock-pips i.filled{background:#c6a67b}
.projection-panel{background:linear-gradient(140deg,#24221d,#14171b)!important;border-color:#66523b!important}

/** A transparent accounting bridge from scoped event IDs to financial totals. */
function reconcileEvidence(dataset,scope){

 for(const sale of scope.sales){
  if(!nonneg(sale.paidPrice)||!nonneg(sale.cost))issues.push(`Чек ${sale.id}: ошибочная цена или себестоимость`);
  entries.push({id:sale.id,date:sale.date,storeId:sale.storeId,kind:'Продажа',sourceId:sale.originRequestId||null,
   revenue:sale.paidPrice,cogs:sale.cost,gross:sale.paidPrice-sale.cost});
 }
 for(const ret of scope.returns){
  const source=salesById.get(ret.saleId);
  if(!source)issues.push(`Возврат ${ret.id}: отсутствует исходный чек`);
  else if(source.modelId!==ret.modelId||source.storeId!==ret.storeId||source.size!==ret.size)issues.push(`Возврат ${ret.id}: расхождение с чеком`);
  if(originalReturnIds.has(ret.saleId))issues.push(`Повторный возврат чека ${ret.saleId}`);
  originalReturnIds.add(ret.saleId);
  if(!nonneg(ret.refundedPrice)||!nonneg(ret.reversedCost))issues.push(`Возврат ${ret.id}: ошибочная сумма`);
  entries.push({id:ret.id,date:ret.date,storeId:ret.storeId,kind:'Возврат',sourceId:ret.saleId,
   revenue:-ret.refundedPrice,cogs:-ret.reversedCost,gross:-ret.refundedPrice+ret.reversedCost});
 }
 const linked=[];
 for(const req of scope.requests.filter(x=>x.purchased)){
  const sale=salesById.get(req.saleId);
  if(!sale||sale.originRequestId!==req.id||sale.modelId!==req.modelId||sale.storeId!==req.storeId||sale.size!==req.size){
   issues.push(`Запрос ${req.id}: нет согласованного связанного чека`);continue;
  }
  if(sale.date<req.date)issues.push(`Запрос ${req.id}: покупка раньше обращения`);
  linked.push({requestId:req.id,saleId:sale.id,date:sale.date,modelId:sale.modelId,storeId:sale.storeId,size:sale.size,
   revenue:sale.paidPrice,cost:sale.cost,gross:sale.paidPrice-sale.cost});

  issues,hasDiscrepancy:issues.length>0,checks:{totals:matchesTotals,returnLinks:!issues.some(x=>x.includes('Возврат')),requestLinks:!issues.some(x=>x.includes('Запрос'))},
  evidenceCount:scope.requests.length+scope.sales.length+scope.returns.length,
  incrementalProfit:null,
  disclaimer:'Валовая прибыль по связанным продажам не доказывает, что покупки не произошли бы без системы.'};

/** Wilson interval for a proportion; used for uncertainty, not causal inference. */

}

  const ids=new Set();let gaps=0,errors=0;
  for(const x of events){
   const mark=(issue,severity='error')=>{problems.push({id:String(x.id||'—'),stream:key,label,issue,severity});if(severity==='error')errors++;else gaps++;};
   if(!x.id||ids.has(x.id))mark('Отсутствует или повторяется идентификатор');
   if(x.id)ids.add(x.id);
   if(!r4DateValid(r4EventDate(x,key)))mark('Некорректная дата события');
   if(x.storeId&&!STORES.some(s=>s.id===x.storeId))mark('Неизвестный филиал');
   if(x.modelId&&!catalogIds.has(x.modelId))mark('Товар не найден в каталоге');
   if(key==='sales'&&(!r4Nonneg(x.paidPrice)||!r4Nonneg(x.cost)))mark('Невалидная цена или себестоимость');
   if(key==='stock'&&(!r4Natural(x.quantity)||!x.modelId||!x.storeId))mark('Остаток не является целым неотрицательным количеством');
   if(key==='stock'&&x.asOf!==AS_OF)mark('Учётный снимок не на дату демонстрации','gap');
   if(key==='returns'){
    const sold=globalSales.get(x.saleId);
    if(!sold)mark('Возврат без исходного чека');
    else{
     if(sold.date>x.date)mark('Возврат датирован раньше продажи');
     if(sold.storeId!==x.storeId||sold.modelId!==x.modelId)mark('SKU или филиал не совпадает с чеком');
     if(x.refundedPrice>sold.paidPrice||x.reversedCost>sold.cost)mark('Сумма возврата превышает исходную сумму');
    }
    if(globallyReturned.has(x.saleId))mark('Повторное сторнирование одного чека');
    globallyReturned.add(x.saleId);
   }
   if(key==='requests'){
    if(x.consent&&!x.solutionFound)mark('Согласие без отмеченного найденного решения','gap');
    if(x.purchased){
     const sold=globalSales.get(x.saleId);
     if(!sold||sold.originRequestId!==x.id||sold.modelId!==x.modelId||sold.size!==x.size||sold.storeId!==x.storeId)mark('Покупка не связана с согласованным чеком');
     else if(sold.date<x.date)mark('Продажа раньше обращения');
     if(linkedRequests.has(x.saleId))mark('Один чек связан с несколькими покупками');
     linkedRequests.add(x.saleId);
    }
   }
   if(key==='traffic'&&(!r4Natural(x.visits)||!r4Natural(x.passers)||x.visits>x.passers))mark('Показания счётчика противоречивы');
   if(key==='assistance'&&(!r4Nonneg(x.responseSeconds)||typeof x.resolved!=='boolean'))mark('Неизвестна длительность или завершение обращения');
  }
  coverage.push({key,label,source,events:events.length,errors,gaps,ids:[...ids].slice(0,4),
   status:events.length===0?'Нет событий':errors?'Есть ошибки':gaps?'Требует уточнения':'Структура проверена'});
 }
 const bridge=reconcileEvidence(dataset,scope);
 for(const issue of bridge.issues)problems.push({id:'LEDGER',stream:'sales',label:'Чеки и связи',issue,severity:'error'});
 return {coverage,problems,critical:problems.filter(x=>x.severity==='error').length,uncertain:problems.filter(x=>x.severity==='gap').length,
  totalEvents:r4Sum(coverage,x=>x.events),bridge,
  limitations:['Все данные синтетические; настоящие интеграции с POS/1С отсутствуют.',
   'Остаток в учётном снимке не подтверждает фактическую доступность на полке.',
   'События не устанавливают причинность или доказанный прирост прибыли.'],
  usableForDescriptiveReporting:!problems.some(x=>x.severity==='error')};
}

/** Cross-store matching with a per-SKU inventory budget, no double-allocation. */
function matchDemand(dataset,scope,options={}){
 const reserve=options.reserve===null?NaN:Number(options.reserve??0),probability=(options.probability===null?NaN:Number(options.probability??55))/100,
  transferCost=options.transferCost===null?NaN:Number(options.transferCost??350),limit=Number(options.limit??250);
 const errors=[];
 if(!r4Natural(reserve)||reserve>1000)errors.push('Резерв должен быть целым числом от 0 до 1000');
 if(!r4Finite(probability)||probability<0||probability>1)errors.push('Вероятность должна быть от 0 до 100%');
 if(!r4Nonneg(transferCost)||transferCost>1000000)errors.push('Затраты на перемещение должны быть неотрицательны');
 if(!r4Natural(limit)||limit<1||limit>2000)errors.push('Ограничение обращений: от 1 до 2000');
 if(errors.length)return {valid:false,errors,matches:[],unmatched:[],totals:null};
 const stock=new Map(dataset.stock.map(x=>[`${x.storeId}|${x.modelId}|${x.size}|${x.color}`,{
  ...x,remaining:Math.max(0,x.quantity-reserve)}]));
 const matches=[],unmatched=[],requests=[...scope.requests].filter(x=>!x.purchased)
  .sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id)).slice(0,limit);
 for(const request of requests){
  const p=dataset.products.find(x=>x.id===request.modelId);
  if(!p){unmatched.push({requestId:request.id,reason:'Нет модели в каталоге'});continue;}
  const key=s=>`${s.id}|${request.modelId}|${request.size}|${request.color}`;
  const local=STORES.find(x=>x.id===request.storeId),localStock=stock.get(key(local||{id:'unknown'}));
  let source=null,kind=null;
  if(localStock?.remaining>0&&localStock.asOf===AS_OF){source=localStock;kind='local';}
  else{
   const remote=STORES.filter(x=>x.id!==request.storeId).map(x=>stock.get(key(x)))
    .filter(x=>x&&x.remaining>0&&x.asOf===AS_OF).sort((a,b)=>b.remaining-a.remaining||a.storeId.localeCompare(b.storeId));
   source=remote[0]||null;kind='transfer';
  }
  if(!source){unmatched.push({requestId:request.id,reason:'Нет доступных единиц по учётному снимку с заданным резервом'});continue;}
  source.remaining--;
  const logistics=kind==='transfer'?transferCost:0;
  const unitGross=p.price-p.cost;
  matches.push({requestId:request.id,date:request.date,modelId:p.id,model:p.name,size:request.size,color:request.color,
   destinationStore:request.storeId,sourceStore:source.storeId,sourceStockId:source.id,kind,
   estimatedGross:r4Round(probability*unitGross),estimatedNet:r4Round(probability*unitGross-logistics),
   logistics,probability,price:p.price,cost:p.cost,
   sourceStatus:'Учётный снимок; обязательна физическая проверка'});
 }
 const locals=matches.filter(x=>x.kind==='local'),transfers=matches.filter(x=>x.kind==='transfer');
 return {valid:true,errors:[],matches,unmatched,considered:requests.length,totalEligible:scope.requests.filter(x=>!x.purchased).length,
  reserve,probability,transferCost,totals:{matched:matches.length,local:locals.length,remote:transfers.length,unmatched:unmatched.length,
   estimatedGross:r4Round(r4Sum(matches,x=>x.estimatedGross)),logistics:r4Round(r4Sum(matches,x=>x.logistics)),
   estimatedNet:r4Round(r4Sum(matches,x=>x.estimatedNet))},
  assumptions:'Сценарный расчёт на учётных снимках и добровольных запросах. Не резервирует товар и не доказывает дополнительные продажи.'};
}

/** SKU-level discount stress test — no demand elasticity is inferred from correlation. */
function discountStress(dataset,scope,options={}){
 const modelId=options.modelId||'JKT-AURA',discount=(options.discount===null?NaN:Number(options.discount??10))/100,
  uplift=(options.uplift===null?NaN:Number(options.uplift??15))/100,campaignCost=options.campaignCost===null?NaN:Number(options.campaignCost??1500);
 const p=dataset.products.find(x=>x.id===modelId),errors=[];
 if(!p)errors.push('Неизвестная модель');
 if(!r4Finite(discount)||discount<0||discount>.95)errors.push('Скидка должна быть от 0 до 95%');
 if(!r4Finite(uplift)||uplift<0||uplift>5)errors.push('Изменение количества: от 0 до 500%');
 if(!r4Nonneg(campaignCost)||campaignCost>1e9)errors.push('Некорректные расходы на кампанию');
 if(errors.length)return {valid:false,errors,modelId};
 const sales=scope.sales.filter(x=>x.modelId===modelId);
 const returns=scope.returns.filter(x=>x.modelId===modelId);
 const returned=new Set(returns.map(x=>x.saleId));
 // The period may contain returns from a sale before the period. Keep gross exact;
 // do not manufacture a baseline unit count when it is <= 0.
 const baselineUnits=sales.length-returns.length;
 const baselineRevenue=r4Round(r4Sum(sales,x=>x.paidPrice)-r4Sum(returns,x=>x.refundedPrice));
 const baselineCogs=r4Round(r4Sum(sales,x=>x.cost)-r4Sum(returns,x=>x.reversedCost));
 const baselineGross=r4Round(baselineRevenue-baselineCogs);
 const validBaseline=baselineUnits>0;
 const newPrice=r4Round(p.price*(1-discount)),unitGross=r4Round(newPrice-p.cost);
 const estimatedUnits=validBaseline?baselineUnits*(1+uplift):null;
 const scenarioGross=validBaseline?r4Round(estimatedUnits*unitGross-campaignCost):null;
 const deltaGross=scenarioGross===null?null:r4Round(scenarioGross-baselineGross);
 const breakEvenUplift=validBaseline&&unitGross>0?r4Round(((baselineGross+campaignCost)/(baselineUnits*unitGross)-1)*100):null;
 const noUplift=validBaseline?r4Round(baselineUnits*unitGross-campaignCost-baselineGross):null;
 return {valid:true,modelId,product:p,baselineUnits,baselineRevenue,baselineCogs,baselineGross,receipts:sales.map(x=>x.id),
  returnIds:returns.map(x=>x.id),validBaseline,newPrice,unitGross,discount,uplift,campaignCost,estimatedUnits,scenarioGross,
  deltaGross,breakEvenUplift,noUplift,errors:[],
  warnings:[!validBaseline?'Недостаточно чистых продаж в периоде для сценарного вывода.':null,
   unitGross<=0?'Скидка приводит к нулевой или отрицательной валовой прибыли с единицы.':null,
   'Предположение о приросте объёма вводится вручную. Цена не доказывает эластичность спроса.',
   'В сценарии неизменны себестоимость и структура возвратов. Реальный эффект необходимо измерить пилотом.'].filter(Boolean),
  provenIncrementalProfit:false};
}

const PORTFOLIO_CATALOG=[
 ['rescue','Проверить доступность размеров','Управляющий сети',6200,'demand'],
 ['inventory','Сверить спорные остатки','Руководитель склада',2400,'inventory'],
 ['fitting','Измерить причины отказов','Руководитель магазина',3400,'service'],
 ['margin','Проверить скидки на AURA','Коммерческий директор',3800,'margin'],
 ['service','Измерить задержки консультантов','Управляющий магазина',3000,'service'],
 ['retention','Проверить повторные визиты','CRM-менеджер',4200,'retention'],
 ['returns','Изучить причины возвратов','Категорийный менеджер',2500,'returns']
];
/** Capital and capacity planning: scores rank *experiments*, not proven earnings. */
function prioritizePortfolio(dataset,scope,options={}){
 const capacity=options.capacity===null?NaN:Number(options.capacity??3),budget=options.budget===null?NaN:Number(options.budget??15000),
  costs=options.costs||{};
 const errors=[];
 if(!r4Natural(capacity)||capacity>7)errors.push('Можно выбрать от 0 до 7 проверок');
 if(!r4Nonneg(budget)||budget>1e9)errors.push('Бюджет не может быть отрицательным');
 if(errors.length)return {valid:false,errors,selected:[],candidates:[]};
 const demand=matchDemand(dataset,scope,{reserve:1,probability:55,transferCost:350});
 const margin=discountStress(dataset,scope,{modelId:'JKT-AURA',discount:10,uplift:15,campaignCost:1500});
 const counts={rescue:demand.totals?.remote||0,inventory:scope.audits.filter(x=>x.status==='Требует сверки').length,
  fitting:scope.fittings.filter(x=>!x.purchased).length,margin:scope.sales.filter(x=>x.modelId==='JKT-AURA').length,
  service:scope.assistance.filter(x=>x.responseSeconds>240).length,
  retention:new Set(scope.sales.map(x=>x.memberId).filter(Boolean)).size,returns:scope.returns.length};
 const candidates=PORTFOLIO_CATALOG.map(([id,title,owner,defaultCost,overlapGroup])=>{
  const c=costs[id]===undefined?defaultCost:costs[id]===null?NaN:Number(costs[id]),invalidCost=!r4Nonneg(c)||c>1e8;
  const sample=counts[id]||0;
  const hasModel=id==='rescue'?demand.totals.remote>0:id==='margin'?margin.validBaseline:sample>0;
  const estimate=id==='rescue'?r4Round(r4Sum(demand.matches.filter(x=>x.kind==='transfer'),x=>x.estimatedNet)):id==='margin'?margin.deltaGross:null;
  const evidenceIds=id==='rescue'?demand.matches.filter(x=>x.kind==='transfer').slice(0,12).map(x=>x.requestId):
   id==='inventory'?scope.audits.filter(x=>x.status==='Требует сверки').slice(0,12).map(x=>x.id):
   id==='fitting'?scope.fittings.filter(x=>!x.purchased).slice(0,12).map(x=>x.id):
   id==='service'?scope.assistance.filter(x=>x.responseSeconds>240).slice(0,12).map(x=>x.id):
   id==='returns'?scope.returns.slice(0,12).map(x=>x.id):
   scope.sales.filter(x=>id==='margin'?x.modelId==='JKT-AURA':!!x.memberId).slice(0,12).map(x=>x.id);
  const score=hasModel&&!invalidCost?Math.round(r4Clip(15+Math.log1p(sample)*11+(id==='rescue'&&estimate>0?26:id==='margin'&&estimate>0?10:0)-c/1800,0,100)):0;
  return {id,title,owner,overlapGroup,cost:c,invalidCost,hasEvidence:hasModel,observations:sample,evidenceIds,score,
   scenarioNet:estimate,confidence:'Гипотеза: эффект ещё не подтверждён',measurement:id==='rescue'?'Найденный товар → последующий чек':id==='margin'?'Валовая прибыль на SKU до/после':'Сопоставимый показатель до/после и контроль',
   status:!hasModel?'Недостаточно событий':invalidCost?'Некорректная стоимость':'Готово к пилотной проверке'};
 }).sort((a,b)=>b.score-a.score||a.id.localeCompare(b.id));
 let left=budget;
 const selected=[];
 for(const row of candidates){
  if(!row.hasEvidence||row.invalidCost||selected.length>=capacity||row.cost>left)continue;
  selected.push(row);left-=row.cost;
 }
 return {valid:true,errors:[],budget,capacity,used:r4Round(budget-left),remaining:r4Round(left),candidates,selected,
  totalScenarioNet:null,overlapWarning:'Финансовые оценки пересекаются по клиентам и гипотезам. Складывать их нельзя.',
  conclusion:selected.length?'Приоритет — измерить эффект этих проверок. Решения не исполнены.':'Для выбранного бюджета и фильтров нет выполнимых проверок.'};
}

const r4CsvSafe=x=>{const s=String(x??'');const escaped=/^[\s\uFEFF]*[=+@\-]/.test(s)?"'"+s:s;return '"'+escaped.replace(/"/g,'""')+'"';};
function dossierSnapshot(dataset,scope,options={}){
 const audit=auditEvidence(dataset,scope),matching=matchDemand(dataset,scope,{reserve:1}),
  portfolio=prioritizePortfolio(dataset,scope,options);
 const fields=['store','category','model','size','period'];
 const filters=Object.fromEntries(fields.map(k=>[k,String(scope.filter[k]??'all')]));
 const ledger=audit.bridge;
 return {schema:1,asOf:AS_OF,origin:'OSMANX · DEMONSTRATION DATA / НЕ РЕАЛЬНЫЙ АУДИТ',scenario:dataset.scenarioId,
  filters,period:{from:scope.from,to:scope.to},totals:{revenue:ledger.revenue,cogs:ledger.cogs,gross:ledger.gross,
   relatedReceipts:ledger.linkedCount,relatedReceiptGross:ledger.linkedGross,unfulfilledRequests:scope.requests.filter(x=>!x.purchased).length},
  quality:{events:audit.totalEvents,errors:audit.critical,gaps:audit.uncertain,integrity:audit.usableForDescriptiveReporting},
  matching:{considered:matching.considered,local:matching.totals.local,remote:matching.totals.remote,unmatched:matching.totals.unmatched,
   scenarioNet:matching.totals.estimatedNet},
  priorities:portfolio.selected.map(x=>({id:x.id,title:x.title,cost:x.cost,owner:x.owner,observations:x.observations,evidenceIds:x.evidenceIds})),
  sampleEvidence:[...new Set([...ledger.linked.slice(0,7).map(x=>x.saleId),...matching.matches.slice(0,12).map(x=>x.requestId)])].slice(0,19),
  warnings:['Синтетические данные и учётные снимки; 1С не подключена.',
   'Валовая прибыль по связанным чекам не доказывает прирост прибыли.',
   'Сценарные оценки и пилоты не являются доказательством причинности.','Физический остаток, резервы и затраты требуется подтвердить.']};
}

function portfolioCsv(portfolio){return r4AsCsv([['Приоритет','Описание','Оснований','Бюджет, ₽','Ответственный','Статус','Денежный сценарий (не доказан), ₽'],
  ...portfolio.candidates.map(x=>[x.id,x.title,x.observations,x.cost,x.owner,x.status,x.scenarioNet??'Неизвестно'])]);}

const integer=(n,max)=>Number.isSafeInteger(n)&&n>=0&&n<=max;
const validDate=x=>{if(typeof x!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(x))return false;const d=new Date(x+'T12:00:00Z');return Number.isFinite(d.valueOf())&&d.toISOString().slice(0,10)===x;};
const dateMs=x=>Date.parse(x+'T12:00:00Z');
const required={
 sales:['id','date','storeId','modelId','size','paidPrice','cost'],
 returns:['id','date','storeId','saleId','modelId','size','refundedPrice','reversedCost'],
 stock:['id','asOf','storeId','modelId','size','color','quantity']
};
const numeric={sales:['paidPrice','cost'],returns:['refundedPrice','reversedCost'],stock:['quantity']};

/** RFC 4180 style quoting, BOM, \n/\r\n and Excel's semicolon delimiter. */
function csvRows(text){
 if(typeof text!=='string'||text.length>1200000)throw Error('CSV должен быть текстом до 1,2 МБ');
 const input=text.replace(/^\uFEFF/,'');const head=input.slice(0,input.indexOf('\n')===-1?input.length:input.indexOf('\n'));
 const delimiter=(head.match(/;/g)||[]).length>(head.match(/,/g)||[]).length?';':',';
 const rows=[];let row=[],field='',quoted=false,closed=false;
 for(let i=0;i<input.length;i++){
  const ch=input[i];
  if(quoted){if(ch==='"'){if(input[i+1]==='"'){field+='"';i++;}else{quoted=false;closed=true;}}else field+=ch;continue;}
  if(ch==='"'){if(field!==''||closed)throw Error('Некорректные кавычки в CSV');quoted=true;continue;}
  if(ch===delimiter||ch==='\n'||ch==='\r'){
   row.push(field);field='';closed=false;
   if(ch!==delimiter){if(row.some(v=>v.trim()!==''))rows.push(row);row=[];if(ch==='\r'&&input[i+1]==='\n')i++;}
   if(rows.length>1501)throw Error('CSV ограничен 1500 строками');continue;
  }
  if(closed&&!/\s/.test(ch))throw Error('Лишние символы после закрывающей кавычки');
  field+=ch;
 }
 if(quoted)throw Error('Не закрыта кавычка CSV');
 row.push(field);if(row.some(v=>v.trim()!==''))rows.push(row);
 if(!rows.length)throw Error('CSV пуст');
 return {delimiter,rows};
}
function reviewImport(text,kind='sales',previousSales=[]){
 const errors=[],issues=[];
 if(!Object.hasOwn(required,kind))return {valid:false,errors:['Неизвестный тип выгрузки'],issues:[],rows:[],kind};
 let parsed;
 try{parsed=csvRows(text);}catch(e){return {valid:false,errors:[e.message],issues:[],rows:[],kind};}
 const [head,...lines]=parsed.rows,cols=head.map(x=>x.trim());
 const missing=required[kind].filter(x=>!cols.includes(x));
 const duplicateColumns=cols.filter((x,i)=>cols.indexOf(x)!==i);
 if(missing.length)errors.push('Нет столбцов: '+missing.join(', '));
 if(duplicateColumns.length)errors.push('Дубли названий столбцов: '+[...new Set(duplicateColumns)].join(', '));
 if(!lines.length)errors.push('Нет строк событий');
 if(errors.length)return {valid:false,kind,errors,issues,rows:[],columns:cols};
 const saleIndex=new Map(previousSales.map(x=>[x.id,x]));const seen=new Set();const rowItems=[];
 for(let i=0;i<lines.length;i++){
  const cells=lines[i],number=i+2,row={};
  if(cells.length!==cols.length){issues.push({row:number,reason:'Количество полей не совпадает с заголовком'});continue;}
  cols.forEach((col,j)=>{row[col]=cells[j].trim();});
  let reasons=[];
  for(const col of required[kind])if(row[col]==='')reasons.push('Пустое поле '+col);
  if(seen.has(row.id))reasons.push('Повторяется ID события');seen.add(row.id);
  if(!storeIds.has(row.storeId))reasons.push('Неизвестный филиал');
  if(!productIds.has(row.modelId))reasons.push('Нет SKU в демонстрационном справочнике');
  if(!['XS','S','M','L','XL'].includes(row.size))reasons.push('Неизвестный размер');
  const date=kind==='stock'?row.asOf:row.date;
  if(!validDate(date))reasons.push('Некорректная календарная дата');
  for(const key of numeric[kind]){
   const source=row[key],value=Number(source);
   if(source===''||!Number.isFinite(value)||value<0||value>1e9||(kind==='stock'&&!integer(value,1000000))){reasons.push('Недопустимое значение '+key);}else row[key]=value;
  }
  if(kind==='returns'){
   const sold=saleIndex.get(row.saleId);
   if(!sold)reasons.push('Возврат не связан с импортированным чеком');
   else{
    if(sold.storeId!==row.storeId||sold.modelId!==row.modelId||sold.size!==row.size)reasons.push('SKU/филиал/размер не совпадает с чеком');
    if(validDate(row.date)&&row.date<sold.date)reasons.push('Возврат раньше чека');
    if(r5Finite(row.refundedPrice)&&row.refundedPrice>sold.paidPrice)reasons.push('Возврат больше оплаты');
    if(r5Finite(row.reversedCost)&&row.reversedCost>sold.cost)reasons.push('Сторно себестоимости выше чека');
   }
  }
  if(reasons.length)issues.push({row:number,id:row.id||'—',reason:reasons.join('; ')});
  else rowItems.push(Object.fromEntries(required[kind].map(k=>[k,row[k]])));
 }
 if(kind==='returns'){
  const bySale=new Set();
  for(const x of rowItems){if(bySale.has(x.saleId))issues.push({row:'—',id:x.id,reason:'Повторное сторнирование одного чека'});bySale.add(x.saleId);}
 }
 const accepted=issues.length?[]:rowItems; // Atomic stage: any invalid row blocks the entire batch.
 const totals=kind==='sales'?{revenue:SUM(rowItems,x=>x.paidPrice),cost:SUM(rowItems,x=>x.cost),gross:SUM(rowItems,x=>x.paidPrice-x.cost)}:
  kind==='returns'?{refund:SUM(rowItems,x=>x.refundedPrice),reverseCost:SUM(rowItems,x=>x.reversedCost)}:{units:SUM(rowItems,x=>x.quantity)};
 return {kind,valid:errors.length===0&&issues.length===0,columns:cols,rows:accepted,inspected:lines.length,validRows:rowItems.length,issues,errors,totals,delimiter:parsed.delimiter,provenance:'Локальная проверка файла; не импортировано в учёт или демопоказатели'};
}
const csvCell=v=>{let s=String(v??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';};
function safeCsv(rows){return '\uFEFF'+rows.map(line=>line.map(csvCell).join(';')).join('\r\n')+'\r\n';}
function reviewedCsv(review){if(!review.valid)return null;return safeCsv([required[review.kind],...review.rows.map(row=>required[review.kind].map(k=>row[k]))]);}
function sampleCsv(kind='sales'){
 if(kind==='stock')return safeCsv([required.stock,['stock-example','2026-11-08','s1','JKT-AURA','L','Графит',3]]);
 if(kind==='returns')return safeCsv([required.returns,['return-example','2026-11-08','s1','sale-example','JKT-AURA','L',8900,4900]]);
 return safeCsv([required.sales,['sale-example','2026-11-08','s1','JKT-AURA','L',8900,4900]]);
}

const monday=date=>{const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7);return d.toISOString().slice(0,10);};
const weekNext=(day,n)=>new Date(dateMs(day)+n*7*86400000).toISOString().slice(0,10);
/** First OBSERVED paid check within the active window, not lifetime customer acquisition. */
function retentionCohorts(dataset,scope,{weeks=4,minCohort=5}={}){
 if(!integer(weeks,8)||weeks<1||!integer(minCohort,1000))return {valid:false,errors:['Недопустимые параметры когорт'],cohorts:[]};
 const returned=new Set(dataset.returns.filter(x=>x.date<=scope.to).map(x=>x.saleId));
 const paid=scope.sales.filter(x=>x.memberId&&!returned.has(x.id)).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
 const byMember=new Map();
 for(const sale of paid){if(!byMember.has(sale.memberId))byMember.set(sale.memberId,[]);byMember.get(sale.memberId).push(sale);}
 const cohorts=new Map();
 for(const [member,sales] of byMember){const started=monday(sales[0].date);if(!cohorts.has(started))cohorts.set(started,[]);cohorts.get(started).push({id:member,sales});}
 const result=[...cohorts.entries()].sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12).map(([start,people])=>{
  const periods=[];
  for(let week=1;week<=weeks;week++){
   const end=weekNext(start,week+1);const cutoff=new Date(dateMs(end)-86400000).toISOString().slice(0,10);
   if(cutoff>scope.to){periods.push({week,rate:null,count:null,complete:false});continue;}
   let count=0,ids=[];
   for(const person of people){const hit=person.sales.find(s=>monday(s.date)===weekNext(start,week));if(hit){count++;ids.push(hit.id);}}
   periods.push({week,rate:count/people.length,count,complete:true,receiptIds:ids.slice(0,12)});
  }
  return {start,customers:people.length,status:people.length>=minCohort?'Описательная когорта':'Малая выборка',periods,firstReceiptIds:people.slice(0,12).map(x=>x.sales[0].id)};
 });
 const mature=result.flatMap(c=>c.periods.filter(x=>x.complete).map(x=>({cohort:c.start,n:c.customers,count:x.count,week:x.week})));
 return {valid:true,cohorts:result,members:byMember.size,sourceReceipts:paid.length,excludedReturns:scope.sales.filter(x=>x.memberId&&returned.has(x.id)).length,
  anonymousSales:scope.sales.filter(x=>!x.memberId).length,weekOne:mature.filter(x=>x.week===1).length?SUM(mature.filter(x=>x.week===1),x=>x.count)/SUM(mature.filter(x=>x.week===1),x=>x.n):null,
  limitations:['Первое наблюдение в выбранном периоде не равно первому визиту за всю жизнь.','Когорта определяется только по синтетическим идентификаторам программы лояльности.','Будущие недели не включаются в знаменатель и показаны как незавершённые.']};
}

/** Budget-constrained collection hypothesis. Distinct event streams cannot be summed into unique buyers. */
function collectionPlan(dataset,scope,{budget=80000,cap=12,reserve=1,leadDays=21,category='all',seasonFactor=1}={}){
 const errors=[];
 if(!r5Finite(budget)||budget<0||budget>1e9)errors.push('Бюджет от 0 до 1 млрд ₽');
 if(!integer(cap,150))errors.push('Количество единиц от 0 до 150');
 if(!integer(reserve,100))errors.push('Резерв от 0 до 100');
 if(!integer(leadDays,365))errors.push('Срок поставки от 0 до 365 дней');
 if(!r5Finite(seasonFactor)||seasonFactor<.25||seasonFactor>3)errors.push('Сезонный коэффициент от 0,25 до 3');
 if(category!=='all'&&!dataset.products.some(p=>p.category===category))errors.push('Неизвестная категория');
 if(errors.length)return {valid:false,errors,rows:[],selected:[],spent:0,remaining:0};
 const groups=new Map(),key=e=>e.storeId+'|'+e.modelId+'|'+e.size;
 const ensure=e=>{const k=key(e);if(!groups.has(k))groups.set(k,{key:k,storeId:e.storeId,modelId:e.modelId,size:e.size,color:'Графит',requests:0,preorders:0,deposits:0,preferences:0,sales:0,returns:0,stock:0,ids:[]});return groups.get(k);};
 const add=(src,field,filter=()=>true)=>{for(const e of src){if(!filter(e))continue;const p=product(e.modelId);if(category!=='all'&&p.category!==category)continue;const g=ensure(e);g[field]++;if(g.ids.length<15)g.ids.push(e.id);}};
 add(scope.requests,'requests',e=>!e.purchased);
 add(scope.preorders,'preorders',e=>e.status!=='Отменён');
 add(scope.preorders,'deposits',e=>e.status!=='Отменён'&&e.depositPaid);
 add(scope.preferences,'preferences');
 add(scope.sales,'sales');
 add(scope.returns,'returns');
 for(const e of scope.stock){const p=product(e.modelId);if(category!=='all'&&p.category!==category)continue;if(e.color==='Графит')ensure(e).stock+=e.quantity;}
 const rows=[...groups.values()].map(g=>{
  const p=product(g.modelId),netSales=Math.max(0,g.sales-g.returns);
  const weighted=g.deposits*.85+(g.preorders-g.deposits)*.35+g.requests*.28+g.preferences*.08+netSales*.06;
  const signal=Math.ceil(weighted*seasonFactor),need=Math.max(0,signal-Math.max(0,g.stock-reserve));
  const confidence=g.deposits>0||g.requests>=5?'Умеренная':g.requests>0||g.preorders>0?'Ограниченная':'Недостаточно прямых сигналов';
  const score=g.deposits*10+g.requests*4+g.preorders*3+g.preferences*.4+netSales*.1;
  return {...g,product:p.name,category:p.category,cost:p.cost,unitGross:p.price-p.cost,score,netSales,need,confidence,orderUnits:0,plannedCost:0,estimatedGross:0};
 }).filter(x=>x.requests+x.preorders+x.preferences>0).sort((a,b)=>b.score-a.score||a.key.localeCompare(b.key));
 let remaining=budget,units=0;
 for(const r of rows){if(units>=cap)break;const affordable=r.cost>0?Math.floor(remaining/r.cost):0;const qty=Math.min(r.need,affordable,cap-units);
  if(qty<=0)continue;r.orderUnits=qty;r.plannedCost=qty*r.cost;r.estimatedGross=qty*r.unitGross;remaining=money(remaining-r.plannedCost);units+=qty;}
 const selected=rows.filter(x=>x.orderUnits>0);
 return {valid:true,rows,selected,spent:money(budget-remaining),remaining,units,unmet:SUM(rows,r=>Math.max(0,r.need-r.orderUnits)),leadDays,category,
  warnings:['Сигналы из разных каналов могут относиться к одному покупателю. Это не число уникальных заказов.',
   'Остатки - только учётный снимок, не гарантированная физическая доступность.',
   'Ожидаемая валовая прибыль не учитывает нереализованный товар, возвраты, налоги и маркетинг.']};
}
function collectionCsv(plan){return safeCsv([['SKU','Размер','Филиал','Модель','Запросы','Предзаказы','Оплаченные задатки','Пожелания','Наличие','Предлагаемые единицы','Себестоимость за ед.','Затраты сценария','Уверенность','ID оснований'],
 ...plan.rows.map(r=>[r.modelId,r.size,r.storeId,r.product,r.requests,r.preorders,r.deposits,r.preferences,r.stock,r.orderUnits,r.cost,r.plannedCost,r.confidence,r.ids.join(' | ')])]);}

function quantile(values,p){if(!values.length)return null;const a=[...values].sort((x,y)=>x-y);const pos=(a.length-1)*p,lo=Math.floor(pos),hi=Math.ceil(pos);return Math.round(a[lo]+(a[hi]-a[lo])*(pos-lo));}
function serviceHealth(scope,{sla=120,minSamples=10}={}){
 const errors=[];
 if(!integer(sla,7200)||sla<1)errors.push('SLA должен быть от 1 до 7200 секунд');
 if(!integer(minSamples,1000)||minSamples<1)errors.push('Минимальная выборка должна быть от 1 до 1000');
 if(errors.length)return {valid:false,errors,byStore:[],all:null};
 const summarise=(events,fittings,storeId)=>{
  const measured=events.filter(e=>r5Finite(e.responseSeconds)&&e.responseSeconds>=0),lat=measured.map(e=>e.responseSeconds),breaches=measured.filter(e=>e.responseSeconds>sla);
  const notPurchased=fittings.filter(e=>!e.purchased),reasoned=notPurchased.filter(e=>e.reason&&e.reasonType==='со слов покупателя');
  const reasonCounts={};for(const e of reasoned)reasonCounts[e.reason]=(reasonCounts[e.reason]||0)+1;
  return {storeId,requests:events.length,sample:measured.length,p50:quantile(lat,.5),p90:quantile(lat,.9),breaches:breaches.length,
   breachRate:measured.length?breaches.length/measured.length:null,resolved:events.filter(e=>e.resolved).length,resolutionRate:events.length?events.filter(e=>e.resolved).length/events.length:null,
   fittingCount:fittings.length,notPurchased:notPurchased.length,reasoned:reasoned.length,unknownReasons:notPurchased.length-reasoned.length,
   reasons:Object.entries(reasonCounts).sort((a,b)=>b[1]-a[1]).map(([reason,count])=>({reason,count})),adequate:measured.length>=minSamples,
   evidenceIds:breaches.slice(0,10).map(x=>x.id),fittingIds:reasoned.slice(0,10).map(x=>x.id)};
 };
 return {valid:true,all:summarise(scope.assistance,scope.fittings,'all'),byStore:STORES.map(s=>summarise(scope.assistance.filter(x=>x.storeId===s.id),scope.fittings.filter(x=>x.storeId===s.id),s.id)),sla,minSamples,
  limitations:['Время реакции измерено по QR-обращениям, а не по всем посетителям.','Причина отказа отражена только там, где покупатель сам назвал её.','Сравнение скорости и покупки не является доказательством влияния на продажи.']};
}
function serviceCsv(report){return safeCsv([['Филиал','Событий','p50 сек','p90 сек','Выше SLA','Разрешены','Примерки без покупки','Названа причина','Неизвестная причина','ID просрочек'],...report.byStore.map(r=>[r.storeId,r.requests,r.p50??'',r.p90??'',r.breaches,r.resolved,r.notPurchased,r.reasoned,r.unknownReasons,r.evidenceIds.join(' | ')])]);}

const BENCHMARK_METRICS={grossProfit:'Валовая прибыль',margin:'Валовая маржа',conversion:'Конверсия визитов',unmetPer100:'Запросы без покупки / 100 визитов',serviceP90:'p90 ответа, сек'};
function branchBenchmark(dataset,scope,{metric='grossProfit',minDays=7}={}){
 const errors=[];if(!Object.hasOwn(BENCHMARK_METRICS,metric))errors.push('Неизвестный показатель');
 if(!integer(minDays,90)||minDays<1)errors.push('Минимальная длительность от 1 до 90 дней');
 if(errors.length)return {valid:false,errors,rows:[]};
 const days=Math.round((dateMs(scope.to)-dateMs(scope.from))/86400000)+1;
 const rows=STORES.map(store=>{
  const s=scopeData(dataset,{...scope.filter,period:'custom',from:scope.from,to:scope.to,store:store.id});
  const lat=s.assistance.map(e=>e.responseSeconds).filter(x=>r5Finite(x)&&x>=0);
  const normalized=s.totals.visits===null||s.totals.visits===0?null:s.totals.unsoldRequests/s.totals.visits*100;
  const m={grossProfit:s.totals.grossProfit,margin:s.totals.grossMargin,conversion:s.totals.conversion,unmetPer100:normalized,serviceP90:quantile(lat,.9)};
  const value=m[metric];
  return {id:store.id,name:store.name,value,metrics:m,days,visits:s.totals.visits,revenue:s.totals.revenue,grossProfit:s.totals.grossProfit,
   saleCount:s.sales.length,returns:s.returns.length,requests:s.requests.length,assistance:s.assistance.length,
   evidenceIds:[...s.sales.slice(0,3).map(x=>x.id),...s.requests.slice(0,3).map(x=>x.id),...s.assistance.slice(0,3).map(x=>x.id)],
   adequate:days>=minDays&&s.sales.length>=10&&(metric==='serviceP90'?lat.length>=10:metric==='conversion'||metric==='unmetPer100'?s.totals.visits!==null&&s.totals.visits>=50:true)};
 });
 const lowerIsBetter=metric==='serviceP90'||metric==='unmetPer100';
 const ranked=[...rows].sort((a,b)=>{if(a.value===null)return 1;if(b.value===null)return -1;return (lowerIsBetter?1:-1)*(a.value-b.value);});
 return {valid:true,metric,label:BENCHMARK_METRICS[metric],rows,ranked,days,comparable:rows.every(x=>x.adequate),
  caveats:[scope.filter.category!=='all'||scope.filter.model!=='all'||scope.filter.size!=='all'?'Для товарных фильтров посещения не относятся к выбранному SKU, поэтому конверсия и запросы на 100 визитов скрываются.':null,
   'Различия между филиалами могут объясняться трафиком, ассортиментом и локальными условиями. Это не доказанная причинность.',
   'Филиалы сопоставляются по одинаковому периоду; источник — синтетические чековые и операционные события.'].filter(Boolean)};
}
function benchmarkCsv(report){return safeCsv([['Филиал','Период, дней','Выручка','Валовая прибыль','Чеков','Возвратов','Запросов','Помощь','Выбранный показатель','Достаточно данных','ID оснований'],...report.rows.map(r=>[r.name,r.days,r.revenue,r.grossProfit,r.saleCount,r.returns,r.requests,r.assistance,r.value??'',r.adequate?'Да':'Нет',r.evidenceIds.join(' | ')])]);}

// MODULE r5_views.mjs
/** R5 quiet-luxury user journeys, no synthetic amounts presented as actual uploads. */



const r5Money=n=>n===null||n===undefined?'—':MONEY(n);
const r5Number=n=>n===null||n===undefined?'—':NUMBER(n);
const r5Percent=n=>n===null||n===undefined?'—':PERCENT(n);
const r5Heading=(index,kicker,title,desc)=>`<header class="r5-heading"><p class="r5-overline">OSMANX / EXECUTIVE R5 · ${index}<span>ДЕМОНСТРАЦИОННЫЕ ДАННЫЕ</span></p><small>${esc(kicker)}</small><h1>${title}</h1><p>${esc(desc)}</p></header>`;
const r5Stat=(label,value,note='')=>`<div class="r5-stat"><span>${esc(label)}</span><strong>${value}</strong>${note?`<small>${esc(note)}</small>`:''}</div>`;
const r5Input=(field,label,value,{min=0,max=999999,step=1}={})=>`<label class="r5-control"><span>${esc(label)}</span><input type="number" data-r5-field="${field}" value="${esc(String(value??''))}" min="${min}" max="${max}" step="${step}" /></label>`;

/** Executive branch scorecard, rendered entirely on-device. */


function drawScorecard(report){
 const canvas=document.createElement('canvas');canvas.width=1240;canvas.height=1754;
 const c=canvas.getContext('2d');if(!c)throw Error('Canvas unavailable');
 const box=(x,y,w,h,fill)=>{c.fillStyle=fill;c.fillRect(x,y,w,h);};
 const text=(value,x,y,size=24,color='#272521',bold=false)=>{c.fillStyle=color;c.font=`${bold?'600':'400'} ${size}px Arial,sans-serif`;c.fillText(String(value),x,y);};
 box(0,0,1240,1754,'#f8f5f0');box(0,0,1240,330,'#181b1e');box(80,74,5,55,'#c4a078');
 text('OSMANX   /   RETAIL INTELLIGENCE',110,115,31,'#f4eadf',true);
 text('ATELIER R5 / BRANCH EVIDENCE',80,175,18,'#d6b990',true);
 c.fillStyle='#f5ebdf';c.font='400 64px Georgia,serif';c.fillText('Три филиала. Один контекст.',80,255);
 text('Демонстрационные данные  |  '+AS_OF,80,304,21,'#ded2c2');
 text('ПОКАЗАТЕЛЬ ДЛЯ СРАВНЕНИЯ',80,421,18,'#a0805e',true);
 text(report.label,80,472,31,'#2d2b28',true);
 report.ranked.forEach((row,i)=>{
  const top=530+i*238;box(80,top,1080,205,i%2===0?'#ebe6de':'#f0ece5');box(80,top,6,205,'#c3a783');
  text('0'+(i+1),105,585,30,'#a0815c');text(row.name,173,585,31,'#302a23',true);
  const value=row.value===null?'Нет измерения':report.metric==='grossProfit'?MONEY(row.value):report.metric==='margin'||report.metric==='conversion'?PERCENT(row.value):NUMBER(row.value)+(report.metric==='serviceP90'?' сек':'');
  text(value,173,650,42,'#3a3027');text(`${row.saleCount} чеков  |  ${row.requests} запросов  |  ${row.returns} возвратов`,173,695,19,'#756c62');
 });
 box(80,1282,1080,238,'#ece4d8');box(80,1282,5,238,'#a58a67');
 text('ЧТО НЕЛЬЗЯ УТВЕРЖДАТЬ ПО ЭТИМ ЦИФРАМ',103,1337,19,'#7a6148',true);
 const cautions=['Разница между филиалами не доказывает эффективность управления.',
  'Учётный чек не описывает все причины отказа от покупки.',
  'Данные синтетические. Интеграции с реальной 1С в демо нет.'];
 cautions.forEach((x,i)=>text('- '+x,103,1391+i*37,19,'#514a42'));
 box(80,1590,1080,1,'#cfc6ba');text('Период: '+report.days+' дней  |  Показатель: '+report.label,80,1634,18,'#7c6b5a');
 text('OSMANX WORLD / DEMO ONLY / NOT PROVEN INCREMENTAL PROFIT',80,1690,17,'#a68f76',true);
 return canvas;
}
function branchPdfBlob(report){if(!report.valid)throw Error('Неверные параметры сравнения');const c=drawScorecard(report);return encodePdf(c.toDataURL('image/jpeg',.91),c.width,c.height);}
function exportBranchPdf(report){const blob=branchPdfBlob(report),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`OSMANX_BRANCH_EVIDENCE_${AS_OF}.pdf`;a.click();setTimeout(()=>URL.revokeObjectURL(url),20000);return blob;}

function preserveRerender(element,fn){const active=document.activeElement===element,selector=element.dataset.calc?`[data-calc="${element.dataset.calc}"]`:element.dataset.r3Pilot?`[data-r3-pilot="${element.dataset.r3Pilot}"]`:element.dataset.r4Field?`[data-r4-field="${element.dataset.r4Field}"]`:element.dataset.r5Field?`[data-r5-field="${element.dataset.r5Field}"]`:`[data-field="${element.dataset.field}"]`;let start=null,end=null;try{start=element.selectionStart;end=element.selectionEnd}catch{}fn();render();if(active){const replacement=root.querySelector(selector);if(replacement){replacement.focus();try{if(start!=null)replacement.setSelectionRange(start,end)}catch{}}}}
function handleField(element){const f=element.dataset.field;
 if(f){if(f==='scenario'){state.scenario=element.value;data=buildDataset(element.value);state.opp='demand';state.funnelStage='request';state.r3TransferPlan=null;state.page='dashboard';render();return;}
  if(['period','store','category','model','size','from','to'].includes(f)){state[f]=element.value;if(f==='category')state.model='all';if(f==='from'&&state.from>state.to)state.to=state.from;if(f==='to'&&state.to<state.from)state.from=state.to;render();return;}
  if(['transferUnits','transferProbability','transferCost'].includes(f)){state[f]=Number(element.value);state.lastVerification=null;render();return;}}
 if(element.dataset.calc){const k=element.dataset.calc;const raw=Number(element.value);preserveRerender(element,()=>{state.calculator[k]=Number.isFinite(raw)?raw:0});}
}
function r4UpdateField(element){
 const key=element.dataset.r4Field,raw=element.value;
 const changes=()=>{
  if(['reserve','probability','transferCost'].includes(key))state.r4Match[key]=raw===''?null:Number(raw);
  else if(['discount','uplift','campaignCost'].includes(key))state.r4Margin[key]=raw===''?null:Number(raw);
  else if(key==='modelId')state.r4Margin.modelId=raw;
  else if(key==='capacity'||key==='budget')state.r4Portfolio[key]=raw===''?null:Number(raw);
  else if(key==='selectedCost')state.r4Portfolio.costs[state.r4PortfolioSelected]=raw===''?null:Number(raw);
  persist();
 };
 if(element.tagName==='INPUT')preserveRerender(element,changes);else{changes();render();}
}
function r5UpdateField(element){
 const k=element.dataset.r5Field,value=element.value,number=value===''?null:Number(value);
 const change=()=>{
  if(k==='kind'){state.r5Data.kind=value;state.r5Data.preview=null;}
  else if(k==='cohortWeeks')state.r5Cohort.weeks=number;
  else if(k==='cohortMin')state.r5Cohort.minCohort=number;
  else if(k==='collectionBudget')state.r5Collection.budget=number;
  else if(k==='collectionCap')state.r5Collection.cap=number;
  else if(k==='collectionReserve')state.r5Collection.reserve=number;
  else if(k==='collectionLead')state.r5Collection.leadDays=number;
  else if(k==='collectionFactor')state.r5Collection.seasonFactor=number;
  else if(k==='collectionCategory')state.r5Collection.category=value;
  else if(k==='serviceSla')state.r5Service.sla=number;
  else if(k==='serviceMin')state.r5Service.minSamples=number;
  else if(k==='benchmarkMetric')state.r5Benchmark.metric=value;
  else if(k==='benchmarkMinDays')state.r5Benchmark.minDays=number;
 };
 if(element.tagName==='INPUT')preserveRerender(element,change);else{change();render();}
}
